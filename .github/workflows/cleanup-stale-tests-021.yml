name: Clean stale tests 0.2.21

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update stale tests and lint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/document.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    #[test]\n    fn new_names_default_to_hsst() {\n        let path = native_path_for_name(Path::new("docs"), "Capítulo 1");\n        assert_eq!(path, Path::new("docs").join("Capítulo 1.hsst"));\n    }\n\n'''
          if old not in s:
              raise SystemExit('missing obsolete native-path test')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')

          p = Path('src/app.rs')
          s = p.read_text(encoding='utf-8')
          old = '''        if self.helix_is_select_mode()\n            && !key.modifiers.contains(KeyModifiers::CONTROL)\n            && !key.modifiers.contains(KeyModifiers::ALT)\n        {\n            if let Some(editor) = self.editor.as_ref() {\n                let win32 = editor.win32_input();\n                match key.code {\n                    KeyCode::Char(_) | KeyCode::Enter | KeyCode::Tab => {\n                        let _ = editor\n                            .send_key(KeyEvent::new(KeyCode::F(22), KeyModifiers::NONE), win32);\n                        let _ = editor.send_key(key, win32);\n                        return;\n                    }\n                    KeyCode::Backspace | KeyCode::Delete => {\n                        let _ = editor\n                            .send_key(KeyEvent::new(KeyCode::F(22), KeyModifiers::NONE), win32);\n                        return;\n                    }\n                    _ => {}\n                }\n            }\n        }\n'''
          new = '''        if self.helix_is_select_mode()\n            && !key.modifiers.contains(KeyModifiers::CONTROL)\n            && !key.modifiers.contains(KeyModifiers::ALT)\n            && let Some(editor) = self.editor.as_ref()\n        {\n            let win32 = editor.win32_input();\n            match key.code {\n                KeyCode::Char(_) | KeyCode::Enter | KeyCode::Tab => {\n                    let _ = editor\n                        .send_key(KeyEvent::new(KeyCode::F(22), KeyModifiers::NONE), win32);\n                    let _ = editor.send_key(key, win32);\n                    return;\n                }\n                KeyCode::Backspace | KeyCode::Delete => {\n                    let _ = editor\n                        .send_key(KeyEvent::new(KeyCode::F(22), KeyModifiers::NONE), win32);\n                    return;\n                }\n                _ => {}\n            }\n        }\n'''
          if old not in s:
              raise SystemExit('missing select-mode block')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-stale-tests-021.yml
          git add src/app.rs src/document.rs
          git commit -m "test: remove obsolete native-format assertion and clean selection bridge [skip ci]"
          git push origin HEAD:main
