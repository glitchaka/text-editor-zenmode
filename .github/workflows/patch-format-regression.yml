name: Extend live F2 regression test
on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-format-regression.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch regression generator
        run: echo '' | base64 -d | python3
      - name: Commit regression extension
        run: |
          git config user.name glitchaka
          git config user.email 82622846+glitchaka@users.noreply.github.com
          git add .github/scripts/verify_format_operational.py
          git commit -m 'test: verify live F2 color refresh'
          git push origin HEAD:main
