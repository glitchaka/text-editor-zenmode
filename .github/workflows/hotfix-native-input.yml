name: Apply native frame and common shortcut fixes

on:
  push:
    paths:
      - '.github/workflows/hotfix-native-input.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch native frame and shortcuts
        shell: python
        run: |
          from pathlib import Path

          def repl(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          # Common Windows editing shortcuts.
          p = Path('src/editor.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '''C-z = "undo"\nC-y = "redo"\nC-S-z = "redo"\nC-a = ["select_all", "select_mode"]''', '''C-z = "undo"\nC-y = "redo"\nC-S-z = "redo"\nC-a = ["select_all", "select_mode"]\nC-s = ":write"\nC-c = "yank_to_clipboard"\nC-x = ["yank_to_clipboard", "delete_selection"]''', 'normal common shortcuts')
          s = repl(s, '''C-z = ["normal_mode", "undo", "insert_mode"]\nC-y = ["normal_mode", "redo", "insert_mode"]\nC-S-z = ["normal_mode", "redo", "insert_mode"]\nC-a = ["normal_mode", "select_all", "select_mode"]''', '''C-z = ["normal_mode", "undo", "insert_mode"]\nC-y = ["normal_mode", "redo", "insert_mode"]\nC-S-z = ["normal_mode", "redo", "insert_mode"]\nC-a = ["normal_mode", "select_all", "select_mode"]\nC-s = ["normal_mode", ":write", "insert_mode"]''', 'insert save shortcut')
          s = repl(s, '''C-z = "undo"\nC-y = "redo"\nC-S-z = "redo"\nC-a = "select_all"''', '''C-z = "undo"\nC-y = "redo"\nC-S-z = "redo"\nC-a = "select_all"\nC-s = ":write"\nC-c = "yank_to_clipboard"\nC-x = ["yank_to_clipboard", "delete_selection"]''', 'select common shortcuts')
          p.write_text(s, encoding='utf-8')

          # Native Windows border/corners and initial focus.
          p = Path('src/app.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '''    // Windows 11 DWM: DWMWA_WINDOW_CORNER_PREFERENCE / DWMWCP_ROUND.\n    const DWMWA_WINDOW_CORNER_PREFERENCE: u32 = 33;\n    const DWMWCP_ROUND: u32 = 2;\n    let preference = DWMWCP_ROUND;\n    unsafe {\n        let _ = DwmSetWindowAttribute(\n            hwnd,\n            DWMWA_WINDOW_CORNER_PREFERENCE,\n            (&preference as *const u32).cast(),\n            std::mem::size_of::<u32>() as u32,\n        );\n    }''', '''    // Windows 11 DWM: keep native rounded corners, but suppress the system\n    // border itself. DWMWA_COLOR_NONE is explicitly supported for this\n    // rounded-without-border case; no transparency mask or fake clipping.\n    const DWMWA_WINDOW_CORNER_PREFERENCE: u32 = 33;\n    const DWMWA_BORDER_COLOR: u32 = 34;\n    const DWMWCP_ROUND: u32 = 2;\n    const DWMWA_COLOR_NONE: u32 = 0xFFFF_FFFE;\n    let preference = DWMWCP_ROUND;\n    let border = DWMWA_COLOR_NONE;\n    unsafe {\n        let _ = DwmSetWindowAttribute(\n            hwnd,\n            DWMWA_WINDOW_CORNER_PREFERENCE,\n            (&preference as *const u32).cast(),\n            std::mem::size_of::<u32>() as u32,\n        );\n        let _ = DwmSetWindowAttribute(\n            hwnd,\n            DWMWA_BORDER_COLOR,\n            (&border as *const u32).cast(),\n            std::mem::size_of::<u32>() as u32,\n        );\n    }''', 'DWM border suppression')
          s = repl(s, '''    #[cfg(windows)]\n    if let Some(hwnd) = slint_hwnd(&ui) {\n        unsafe {\n            enable_native_rounded_corners(hwnd);\n        }\n    }''', '''    #[cfg(windows)]\n    if let Some(hwnd) = slint_hwnd(&ui) {\n        unsafe {\n            enable_native_rounded_corners(hwnd);\n            focus_native_window(hwnd);\n        }\n    }''', 'initial native focus')
          s = repl(s, '''                #[cfg(windows)]\n                if let Some(hwnd) = slint_hwnd(&ui) {\n                    unsafe {\n                        set_zen_topmost(hwnd, zen);\n                    }\n                }''', '''                #[cfg(windows)]\n                if let Some(hwnd) = slint_hwnd(&ui) {\n                    unsafe {\n                        set_zen_topmost(hwnd, zen);\n                        if !zen {\n                            enable_native_rounded_corners(hwnd);\n                            focus_native_window(hwnd);\n                        }\n                    }\n                }''', 'restore native frame after zen')
          p.write_text(s, encoding='utf-8')

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/editor.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: suppress black DWM border and restore common shortcuts"
          git push
