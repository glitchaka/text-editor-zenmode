name: Fix editor interaction once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply requested fixes
        run: python scripts/fix_editor_interaction_once.py

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Commit fixes and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/fix-editor-interaction-once.yml
          rm scripts/fix_editor_interaction_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/editor.rs src/format.rs Cargo.toml .github/workflows/fix-editor-interaction-once.yml scripts/fix_editor_interaction_once.py
          git commit -m "Corregir directorio formato y selección de texto"
          git push origin HEAD:main
