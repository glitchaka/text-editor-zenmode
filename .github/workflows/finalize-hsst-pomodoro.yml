name: Finalize HSST Pomodoro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-hsst-pomodoro.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Rust implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = git show 0ec1b9152e880c592c6a925a5f7ddf95e69d429b:.github/workflows/finalize-hsst-pomodoro.yml
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo leer el parche final anterior' }
          $lines = @($old -split "`n")
          $runIndex = [Array]::IndexOf($lines, '        run: |')
          if ($runIndex -lt 0) { throw 'No se encontró el bloque de implementación' }
          $endIndex = -1
          for ($i = $runIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -eq '      - name: Format') { $endIndex = $i; break }
          }
          if ($endIndex -lt 0) { throw 'No se encontró el final del bloque de implementación' }
          $scriptLines = New-Object System.Collections.Generic.List[string]
          for ($i = $runIndex + 1; $i -lt $endIndex; $i++) {
            $line = $lines[$i].TrimEnd("`r")
            $remove = [Math]::Min(10, $line.Length - $line.TrimStart().Length)
            $scriptLines.Add($line.Substring($remove))
          }
          $scriptPath = Join-Path $env:RUNNER_TEMP 'finalize-hsst.ps1'
          [System.IO.File]::WriteAllLines($scriptPath, $scriptLines, [System.Text.UTF8Encoding]::new($false))
          & $scriptPath
      - name: Format
        shell: pwsh
        run: cargo fmt --all
      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: pwsh
        run: cargo clippy --release -- -D warnings
      - name: Tests
        shell: pwsh
        run: cargo test --release
      - name: Build
        shell: pwsh
        run: cargo build --release
      - name: Commit Rust implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+glitchaka@users.noreply.github.com"
          git add src Cargo.toml
          git commit -m "Finalizar formato contextual y Pomodoro [skip ci]"
          git push origin HEAD:main
