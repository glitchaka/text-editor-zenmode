name: Finalize HSST Pomodoro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-hsst-pomodoro.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply runtime fixes
        shell: pwsh
        run: |
          $path = '.github/scripts/finalize_runtime.ps1'
          $script = Get-Content -Raw $path
          $needle = '  $i = $Text.IndexOf($Old)'
          $insert = '  $Text = $Text.Replace("`r`n", "`n")' + "`n" + '  $Old = $Old.Replace("`r`n", "`n")' + "`n" + '  $New = $New.Replace("`r`n", "`n")' + "`n" + $needle
          $script = $script.Replace($needle, $insert)
          $script = $script.Replace('if ($a.Contains($oldOpen)) {', 'if ($a.Contains($oldOpen.Replace("`r`n", "`n"))) {')
          [System.IO.File]::WriteAllText($path, $script, [System.Text.UTF8Encoding]::new($false))
          & $path
      - name: Format
        shell: pwsh
        run: cargo fmt --all
      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: pwsh
        run: cargo clippy --release -- -D warnings
      - name: Tests
        shell: pwsh
        run: cargo test --release
      - name: Build
        shell: pwsh
        run: cargo build --release
      - name: Commit final sources and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+glitchaka@users.noreply.github.com"
          git rm .github/workflows/finalize-hsst-pomodoro.yml .github/scripts/finalize_runtime.ps1
          git add src Cargo.toml
          git commit -m "Corregir formato visual y Pomodoro de launcher [skip ci]"
          git push origin HEAD:main
