name: Bottom island once

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/bottom-island-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply patch
        shell: pwsh
        run: |
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          Invoke-Expression $script

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Clippy
        shell: pwsh
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release
        shell: pwsh
        run: cargo build --release

      - name: Commit and cleanup
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item ".github/workflows/bottom-island-once.yml" -Force
          git add Cargo.toml src/app.rs .github/workflows/bottom-island-once.yml
          git commit -m "Mover isla al pie y reducir controles [skip ci]"
          git push origin HEAD:main
