name: Publish v0.2.20

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.20 --repo "${{ github.repository }}" --target a60f55cdee5e5558fe0cc90113e43402e8eddf2d --title "Zen Editor v0.2.20" --notes $'## Zen Editor v0.2.20\n\n- Eliminar restos visuales de los menús F2 mediante un repintado completo de Helix.\n- Añadir creación de carpetas desde el launcher.\n- Añadir agrupación de documentos por proyecto mediante un manifiesto de proyecto.\n- Mantener el dock visible y compacto sin cubrir la línea de estado del editor.\n- Mostrar contador de palabras en el dock.\n- Cambiar F11/Zen a ventana maximizada sin ocultar la barra de tareas de Windows.'
