name: Fix F2 render and drag
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-f2-render-and-drag.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch F2 redraw and drag
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.rs')
          t=p.read_text(encoding='utf-8')
          old='''        // Native drag target: do not rely on Slint WindowMoveArea for the frameless Win32 window.\n        window-drag-strip := TouchArea {\n            x: 7px;\n            y: 7px;\n            width: root.width - 14px;\n            height: 22px;\n            enabled: !root.zen-active\n                && !root.font-palette-open\n                && !root.highlight-palette-open\n                && !root.symbols-open\n                && !root.page-menu-open;\n            pointer-event(event) => {\n                if event.button == PointerEventButton.left && event.kind == PointerEventKind.down {\n                    root.begin-window-drag();\n                    EventResult.accept\n                } else {\n                    EventResult.reject\n                }\n            }\n        }\n'''
          new='''        // Dedicated frameless titlebar handled by Slint/Winit.\n        window-drag-strip := WindowMoveArea {\n            x: 7px;\n            y: 7px;\n            width: root.width - 14px;\n            height: 24px;\n            enabled: !root.zen-active\n                && !root.symbols-open\n                && !root.page-menu-open;\n        }\n'''
          if old not in t:
              raise SystemExit('drag target missing')
          t=t.replace(old,new,1)
          old='''                } else if modified.is_some() && modified != self.source_modified {\n                    self.source_modified = modified;\n                    if let Err(error) = editor.refresh_after_formatting() {\n                        self.launcher.message =\n                            Some(format!("No se pudo refrescar el formato: {error}"));\n                    }\n                }\n'''
          new='''                } else if modified.is_some() && modified != self.source_modified {\n                    self.source_modified = modified;\n                    // F2 changes formatting.json without necessarily changing terminal text.\n                    // Force the HSST overlay to be rebuilt immediately.\n                    self.dirty = true;\n                    if let Err(error) = editor.refresh_after_formatting() {\n                        self.launcher.message =\n                            Some(format!("No se pudo refrescar el formato: {error}"));\n                    }\n                }\n'''
          if old not in t:
              raise SystemExit('F2 redraw target missing')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit
        shell: bash
        run: |
          git config user.name glitchaka
          git config user.email 82622846+glitchaka@users.noreply.github.com
          git add src/app.rs
          git commit -m 'fix: redraw F2 formatting and restore drag'
          git push origin HEAD:main
