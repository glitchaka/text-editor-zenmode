name: Reconstruct release history

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct versions, changelog and releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          commits = run("git", "rev-list", "--reverse", "HEAD").splitlines()
          transitions = []
          last_version = None

          for sha in commits:
              try:
                  cargo = subprocess.check_output(
                      ["git", "show", f"{sha}:Cargo.toml"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              m = re.search(r'^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', cargo, re.M)
              if not m:
                  continue
              version = m.group(1)
              if version != last_version:
                  transitions.append([version, sha])
                  last_version = version

          root = run("git", "rev-list", "--max-parents=0", "HEAD").splitlines()[0]
          if not transitions:
              raise SystemExit("No se encontraron versiones en Cargo.toml")
          if transitions[0][0] != "0.0.1":
              transitions.insert(0, ["0.0.1", root])

          # Deduplicate defensively while preserving chronology.
          dedup = []
          seen = set()
          for version, start in transitions:
              if version in seen:
                  continue
              dedup.append([version, start])
              seen.add(version)
          transitions = dedup

          def previous_commit(sha):
              try:
                  return run("git", "rev-parse", f"{sha}^")
              except subprocess.CalledProcessError:
                  return sha

          versions = []
          for i, (version, start) in enumerate(transitions):
              if i + 1 < len(transitions):
                  end = previous_commit(transitions[i + 1][1])
              else:
                  end = run("git", "rev-parse", "HEAD")
              versions.append({"version": version, "start": start, "end": end})

          def subjects(start, end):
              if start == root:
                  range_spec = end
              else:
                  parent = previous_commit(start)
                  range_spec = f"{parent}..{end}"
              raw = run("git", "log", "--reverse", "--format=%s", range_spec)
              items = []
              for subject in raw.splitlines():
                  subject = subject.strip()
                  if not subject:
                      continue
                  low = subject.lower()
                  if "reconstruct release history" in low or "release reconstruction" in low:
                      continue
                  if subject not in items:
                      items.append(subject)
              return items[:60]

          lines = [
              "# Historial de versiones — Zen Editor",
              "",
              "Historial reconstruido desde el historial Git del proyecto. Cada versión corresponde al estado final del código antes del siguiente cambio de versión.",
              "",
          ]

          for item in reversed(versions):
              version = item["version"]
              end = item["end"]
              date = run("git", "show", "-s", "--format=%cs", end)
              lines += [f"## v{version} — {date}", ""]
              changes = subjects(item["start"], end)
              if changes:
                  lines += [f"- {s}" for s in changes]
              else:
                  lines.append("- Estado histórico inicial del proyecto.")
              lines.append("")

          Path("CHANGELOG.md").write_text("\n".join(lines), encoding="utf-8")

          manifest = []
          for item in versions:
              manifest.append("|".join([item["version"], item["start"], item["end"]]))
          Path("/tmp/version-manifest.txt").write_text("\n".join(manifest) + "\n", encoding="utf-8")
          PY

          git add CHANGELOG.md
          git rm .github/workflows/reconstruct-release-history.yml
          if ! git diff --cached --quiet; then
            git commit -m "docs: reconstruct version history from v0.0.1 [skip ci]"
            git push origin HEAD:main
          fi

          FINAL_HEAD="$(git rev-parse HEAD)"
          CURRENT_VERSION="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -n1)"

          while IFS='|' read -r VERSION START END; do
            [ -n "$VERSION" ] || continue
            TAG="v${VERSION}"
            TARGET="$END"
            if [ "$VERSION" = "$CURRENT_VERSION" ]; then
              TARGET="$FINAL_HEAD"
            fi

            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              continue
            fi

            DATE="$(git show -s --format=%cs "$TARGET")"
            NOTES="/tmp/release-${VERSION}.md"
            {
              echo "## Zen Editor ${TAG}"
              echo
              echo "Versión histórica reconstruida desde el historial Git."
              echo
              echo "**Fecha del estado:** ${DATE}"
              echo
              echo "### Cambios"
              if [ "$START" = "$(git rev-list --max-parents=0 HEAD | head -n1)" ]; then
                RANGE="$TARGET"
              else
                PARENT="$(git rev-parse "${START}^" 2>/dev/null || echo "$START")"
                RANGE="${PARENT}..${TARGET}"
              fi
              git log --reverse --format='- %s' "$RANGE" \
                | grep -viE 'reconstruct release history|release reconstruction' \
                | awk '!seen[$0]++' \
                | head -n 60 || true
            } > "$NOTES"

            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$TARGET" \
              --title "Zen Editor ${TAG}" \
              --notes-file "$NOTES"
          done < /tmp/version-manifest.txt
