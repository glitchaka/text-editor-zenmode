name: Apply page hard wrap v2 once

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply page hard wrap
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          page = Path("src/page.rs")
          text = page.read_text(encoding="utf-8")
          text = text.replace("    #[cfg(test)]\n    pub fn content_size_tenth_mm(self) -> (u16, u16) {", "    pub fn content_size_tenth_mm(self) -> (u16, u16) {")
          marker = '''    pub fn cycle_margin(value: u16) -> u16 {
          '''
          addition = '''    /// Logical hard-wrap width derived from the printable page width.
              /// Letter portrait with 25 mm side margins is the reference profile: 88 columns.
              pub fn text_columns(self) -> usize {
                  const LETTER_PRINTABLE_TENTH_MM: u32 = 1_659;
                  const LETTER_REFERENCE_COLUMNS: u32 = 88;
                  let printable = u32::from(self.content_size_tenth_mm().0);
                  let columns = (printable * LETTER_REFERENCE_COLUMNS + LETTER_PRINTABLE_TENTH_MM / 2)
                      / LETTER_PRINTABLE_TENTH_MM;
                  columns.clamp(24, 180) as usize
              }

          '''
          if "pub fn text_columns(self)" not in text:
              if marker not in text:
                  raise SystemExit("page insertion point not found")
              text = text.replace(marker, addition + marker, 1)
          page.write_text(text, encoding="utf-8")

          editor = Path("src/editor.rs")
          text = editor.read_text(encoding="utf-8")
          old = '''    pub fn paste(&self, text: &str, ensure_insert: bool) -> Result<()> {
                  let win32 = self.win32_input();
                  let prepared = normalize_pasted_text(text);
          '''
          new = '''    pub fn paste(
                  &self,
                  text: &str,
                  ensure_insert: bool,
                  wrap_width: Option<usize>,
              ) -> Result<()> {
                  let win32 = self.win32_input();
                  let prepared = match wrap_width {
                      Some(width) => wrap_pasted_text(text, width),
                      None => normalize_pasted_text(text),
                  };
          '''
          if old not in text:
              raise SystemExit("paste signature block not found")
          text = text.replace(old, new, 1)

          marker = '''fn encode_paste(text: &str, win32: bool) -> Vec<u8> {
          '''
          helper = r'''fn wrap_pasted_text(text: &str, width: usize) -> String {
              let normalized = normalize_pasted_text(text);
              if width == 0 {
                  return normalized;
              }

              let mut output = String::with_capacity(normalized.len());
              for (line_index, line) in normalized.split('\n').enumerate() {
                  if line_index > 0 {
                      output.push('\n');
                  }

                  let mut remaining = line;
                  while remaining.chars().count() > width {
                      let boundary = remaining
                          .char_indices()
                          .nth(width)
                          .map(|(index, _)| index)
                          .unwrap_or(remaining.len());
                      let prefix = &remaining[..boundary];
                      let whitespace = prefix
                          .char_indices()
                          .rev()
                          .find(|(_, ch)| ch.is_whitespace())
                          .map(|(index, _)| index);

                      if let Some(split) = whitespace.filter(|split| *split > 0) {
                          output.push_str(prefix[..split].trim_end());
                          output.push('\n');
                          remaining = remaining[split..].trim_start_matches(char::is_whitespace);
                      } else {
                          output.push_str(prefix);
                          output.push('\n');
                          remaining = &remaining[boundary..];
                      }
                  }
                  output.push_str(remaining);
              }
              output
          }

          '''
          if "fn wrap_pasted_text(text: &str, width: usize)" not in text:
              if marker not in text:
                  raise SystemExit("encode_paste insertion point not found")
              text = text.replace(marker, helper + marker, 1)
          editor.write_text(text, encoding="utf-8")

          app = Path("src/app.rs")
          text = app.read_text(encoding="utf-8")
          text = text.replace(
              "editor.paste(symbol, ensure_insert)",
              "editor.paste(symbol, ensure_insert, self.page_wrap_columns())"
          )
          text = text.replace(
              "let _ = editor.paste(&text, ensure_insert);",
              "let _ = editor.paste(&text, ensure_insert, self.page_wrap_columns());"
          )

          marker = '''    fn helix_is_modified(&self) -> bool {
          '''
          helpers = '''    fn page_wrap_columns(&self) -> Option<usize> {
                  let current = self.current_file.as_deref()?;
                  document::is_supported_text_path(current).then(|| self.page_profile.text_columns())
              }

              fn helix_cursor_position(&self) -> Option<(usize, usize)> {
                  status_position(&self.helix_status_text())
              }

              fn helix_current_line_prefix(&self) -> Option<String> {
                  let (_, logical_column) = self.helix_cursor_position()?;
                  let screen = self.parser.screen();
                  let (row, screen_column) = screen.cursor_position();
                  let before = logical_column.saturating_sub(1) as u16;
                  let start = screen_column.saturating_sub(before);
                  let mut prefix = String::new();
                  for col in start..screen_column {
                      let cell = screen.cell(row, col)?;
                      if !cell.is_wide_continuation() {
                          prefix.push_str(cell.contents());
                      }
                  }
                  Some(prefix)
              }

              fn hard_wrap_typing_if_needed(&mut self, key: KeyEvent) -> bool {
                  if !self.helix_is_insert_mode()
                      || key.modifiers.contains(KeyModifiers::CONTROL)
                      || key.modifiers.contains(KeyModifiers::ALT)
                  {
                      return false;
                  }
                  let KeyCode::Char(ch) = key.code else {
                      return false;
                  };
                  let Some(limit) = self.page_wrap_columns() else {
                      return false;
                  };
                  let Some((_, column)) = self.helix_cursor_position() else {
                      return false;
                  };
                  if column <= limit {
                      return false;
                  }
                  let Some(editor) = self.editor.as_ref() else {
                      return false;
                  };
                  let win32 = editor.win32_input();

                  if ch.is_whitespace() {
                      let _ = editor.send_key(KeyEvent::new(KeyCode::Enter, KeyModifiers::NONE), win32);
                      return true;
                  }

                  let prefix = self.helix_current_line_prefix().unwrap_or_default();
                  if prefix.chars().any(char::is_whitespace) {
                      let _ = editor.send_key(KeyEvent::new(KeyCode::F(13), KeyModifiers::NONE), win32);
                      let _ = editor.send_key(KeyEvent::new(KeyCode::Enter, KeyModifiers::NONE), win32);
                      let _ = editor.send_key(KeyEvent::new(KeyCode::End, KeyModifiers::NONE), win32);
                      let _ = editor.send_key(key, win32);
                      return true;
                  }
                  false
              }

          '''
          if "fn page_wrap_columns(&self)" not in text:
              if marker not in text:
                  raise SystemExit("app helper insertion point not found")
              text = text.replace(marker, helpers + marker, 1)

          needle = '''        if let Some(editor) = self.editor.as_ref() {
                      if let Some(code) = bridged_editor_shortcut(key) {
          '''
          repl = '''        if self.hard_wrap_typing_if_needed(key) {
                      return;
                  }

                  if let Some(editor) = self.editor.as_ref() {
                      if let Some(code) = bridged_editor_shortcut(key) {
          '''
          if "hard_wrap_typing_if_needed(key)" not in text:
              if needle not in text:
                  raise SystemExit("editor send insertion point not found")
              text = text.replace(needle, repl, 1)

          old = '''fn status_line_number(status: &str) -> Option<usize> {
              status.split_whitespace().rev().find_map(|token| {
                  let (line, column) = token.split_once(':')?;
                  if column.parse::<usize>().is_err() {
                      return None;
                  }
                  line.parse::<usize>().ok()
              })
          }
          '''
          new = '''fn status_position(status: &str) -> Option<(usize, usize)> {
              status.split_whitespace().rev().find_map(|token| {
                  let (line, column) = token.split_once(':')?;
                  Some((line.parse::<usize>().ok()?, column.parse::<usize>().ok()?))
              })
          }

          fn status_line_number(status: &str) -> Option<usize> {
              status_position(status).map(|(line, _)| line)
          }
          '''
          if old not in text:
              raise SystemExit("status_line_number block not found")
          text = text.replace(old, new, 1)
          app.write_text(text, encoding="utf-8")
          '@ | python -

          cargo fmt --all
          cargo check

      - name: Commit and remove workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-page-hardwrap-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/page.rs src/editor.rs src/app.rs .github/workflows/apply-page-hardwrap-v2-once.yml
          git commit -m "Usar margenes de pagina como saltos de linea reales"
          git push origin HEAD:main
