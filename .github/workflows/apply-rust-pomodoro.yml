name: Finish Helix SST formatting and Pomodoro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-rust-pomodoro.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply source fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-Lf([string]$Path) {
            (Get-Content -Raw $Path).Replace("`r`n", "`n")
          }
          function Write-Utf8([string]$Path, [string]$Text) {
            [System.IO.File]::WriteAllText($Path, $Text, [System.Text.UTF8Encoding]::new($false))
          }
          function Replace-Once([string]$Text, [string]$Old, [string]$New, [string]$Label) {
            $index = $Text.IndexOf($Old)
            if ($index -lt 0) { throw "No se encontró bloque: $Label" }
            $Text.Substring(0, $index) + $New + $Text.Substring($index + $Old.Length)
          }

          $editor = Read-Lf 'src/editor.rs'
          $themeStart = $editor.IndexOf("fn write_zen_theme(path: &Path) -> Result<()> {")
          $themeEnd = $editor.IndexOf("fn write_break_theme(path: &Path) -> Result<()> {", $themeStart)
          if ($themeStart -lt 0 -or $themeEnd -lt 0) { throw 'No se encontró write_zen_theme' }
          $theme = @(
            'fn write_zen_theme(path: &Path) -> Result<()> {',
            '    fs::write(path, crate::format::ENHANCED_THEME)?;',
            '    Ok(())',
            '}',
            '',
            ''
          ) -join "`n"
          $editor = $editor.Substring(0, $themeStart) + $theme + $editor.Substring($themeEnd)
          Write-Utf8 'src/editor.rs' $editor

          $app = Read-Lf 'src/app.rs'
          $app = Replace-Once $app "    zen_requested: bool,`n    pomodoro_offer: bool," "    zen_requested: bool,`n    pomodoro_requested: bool,`n    pomodoro_offer: bool," 'campo pomodoro_requested'
          $app = Replace-Once $app "            zen_requested,`n            pomodoro_offer: false," "            zen_requested,`n            pomodoro_requested: false,`n            pomodoro_offer: false," 'inicialización pomodoro_requested'
          $app = $app.Replace('self.selected = self.selected.min(self.entries.len() + 2);', 'self.selected = self.selected.min(self.entries.len() + 3);')
          $app = $app.Replace('.checked_sub(3)', '.checked_sub(4)')

          $oldOpen = @(
            '        self.editor = Some(session);',
            '        self.pomodoro_offer = true;',
            '        self.pomodoro_active = false;',
            '        self.pomodoro_break = false;',
            '        self.pomodoro_deadline = None;',
            '        self.command_capture = None;',
            '        self.glyphs.clear();',
            '        self.dirty = true;',
            '        Ok(())'
          ) -join "`n"
          $newOpen = @(
            '        self.editor = Some(session);',
            '        self.pomodoro_offer = false;',
            '        self.pomodoro_active = false;',
            '        self.pomodoro_break = false;',
            '        self.pomodoro_deadline = None;',
            '        self.command_capture = None;',
            '        if self.pomodoro_requested {',
            '            self.start_pomodoro();',
            '        }',
            '        self.glyphs.clear();',
            '        self.dirty = true;',
            '        Ok(())'
          ) -join "`n"
          $app = Replace-Once $app $oldOpen $newOpen 'inicio de Pomodoro al abrir'

          $oldModes = @(
            '        for (index, (label, active)) in [',
            '            ("Normal", !self.zen_requested),',
            '            ("Zenmode real", self.zen_requested),',
            '        ]'
          ) -join "`n"
          $newModes = @(
            '        for (index, (label, active)) in [',
            '            ("Normal", !self.zen_requested),',
            '            ("Zenmode real", self.zen_requested),',
            '            ("Pomodoro 25/5", self.pomodoro_requested),',
            '        ]'
          ) -join "`n"
          $app = Replace-Once $app $oldModes $newModes 'fila Pomodoro del launcher'

          $app = $app.Replace('(self.launcher.selected + 1).min(self.launcher.entries.len() + 2)', '(self.launcher.selected + 1).min(self.launcher.entries.len() + 3)')
          $app = $app.Replace("self.launcher.selected = 2;`n                self.launcher.creating = true;", "self.launcher.selected = 3;`n                self.launcher.creating = true;")

          $oldR = "            KeyCode::Char('r') | KeyCode::Char('R') => self.launcher.refresh(),"
          $newR = @(
            "            KeyCode::Char('r') | KeyCode::Char('R') => self.launcher.refresh(),",
            "            KeyCode::Char('p') | KeyCode::Char('P') | KeyCode::F(4) => {",
            '                self.pomodoro_requested = !self.pomodoro_requested;',
            '                self.launcher.message = Some(if self.pomodoro_requested {',
            '                    "Pomodoro 25/5 activado para el próximo archivo.".into()',
            '                } else {',
            '                    "Pomodoro desactivado.".into()',
            '                });',
            '            }'
          ) -join "`n"
          $app = Replace-Once $app $oldR $newR 'atajo Pomodoro launcher'

          $oldEnter = @(
            '                2 => {',
            '                    self.launcher.creating = true;',
            '                    self.launcher.new_name.clear();',
            '                    self.launcher.message = None;',
            '                }',
            '                _ => {'
          ) -join "`n"
          $newEnter = @(
            '                2 => {',
            '                    self.pomodoro_requested = !self.pomodoro_requested;',
            '                    self.launcher.message = Some(if self.pomodoro_requested {',
            '                        "Pomodoro 25/5 activado para el próximo archivo.".into()',
            '                    } else {',
            '                        "Pomodoro desactivado.".into()',
            '                    });',
            '                }',
            '                3 => {',
            '                    self.launcher.creating = true;',
            '                    self.launcher.new_name.clear();',
            '                    self.launcher.message = None;',
            '                }',
            '                _ => {'
          ) -join "`n"
          $app = Replace-Once $app $oldEnter $newEnter 'Enter Pomodoro launcher'

          $app = $app.Replace('let chrome_rows = 16usize;', 'let chrome_rows = 17usize;')
          $app = $app.Replace('let file_selected = selected.saturating_sub(2);', 'let file_selected = selected.saturating_sub(3);')
          $app = $app.Replace('let selected_now = selected == 2;', 'let selected_now = selected == 3;')
          $app = $app.Replace('let selected_now = selected == index + 2;', 'let selected_now = selected == index + 3;')
          $app = $app.Replace('↑↓ seleccionar  Enter abrir  N nuevo  E exportar  Z modo  Backspace subir  R refrescar', '↑↓ seleccionar  Enter abrir  N nuevo  E exportar  Z modo  P/F4 Pomodoro  Backspace subir  R refrescar')

          $rx = [regex]::new('visible: root\.editor-active && island\.width >= 840px;')
          $app = $rx.Replace($app, 'visible: false;', 6)
          Write-Utf8 'src/app.rs' $app

          $cargo = Read-Lf 'Cargo.toml'
          $cargo = $cargo.Replace('version = "0.2.11"', 'version = "0.2.12"')
          Write-Utf8 'Cargo.toml' $cargo

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Commit source and remove temporary workflows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item '.github/workflows/apply-rust-pomodoro.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/finalize-hsst-pomodoro.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/repair-finalize-yaml.yml' -Force -ErrorAction SilentlyContinue
          git add Cargo.toml src/app.rs src/editor.rs .github/workflows
          git commit -m "Corregir formato visual y mover Pomodoro al launcher [skip ci]"
          git push origin HEAD:main
