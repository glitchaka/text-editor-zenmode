name: Apply island visibility fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-island-fix.yml
      - tools/apply_island_fix.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python tools/apply_island_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/apply-island-fix.yml tools/apply_island_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs Cargo.toml .github/workflows/apply-island-fix.yml tools/apply_island_fix.py
          git commit -m "Mantener isla visible al salir de Zenmode [skip ci]"
          git push origin HEAD:main
