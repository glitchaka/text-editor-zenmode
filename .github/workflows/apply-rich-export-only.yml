name: Apply rich export source patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-rich-export-only.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged rich export patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/finish-rich-export.yml').read_text(encoding='utf-8')
          block = text.split("python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'finish-rich-export', 'exec'), {'__name__': '__main__'})
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/export.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat: preserve rich formatting and alignment in DOCX and PDF exports"
          git pull --rebase origin main
          git push origin HEAD:main
