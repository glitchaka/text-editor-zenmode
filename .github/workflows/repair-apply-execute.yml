name: Repair Apply Execute Block

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-apply-execute.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make executeCommand patch structural
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/workflows/apply-rust-pomodoro.yml')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(
              r"          \$oldExecute = @'\n.*?\n          '@\n          \$newExecute = @'",
              "          $newExecute = @'",
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('old execute here-string not found')
          old = "          Replace-Once 'src/spell.rs' $oldExecute $newExecute 'executeCommand'\n"
          new = """          $spell = Get-Content -Raw 'src/spell.rs'\n          $execStart = $spell.IndexOf('            \"workspace/executeCommand\" => {')\n          $execEnd = $spell.IndexOf('            \"shutdown\" => {', $execStart)\n          if ($execStart -lt 0 -or $execEnd -lt 0) { throw 'No se encontró bloque estructural executeCommand' }\n          $spell = $spell.Substring(0, $execStart) + $newExecute + $spell.Substring($execEnd)\n          Write-Utf8 'src/spell.rs' $spell\n"""
          if old not in s2:
              raise SystemExit('execute replacement call not found')
          s2 = s2.replace(old, new, 1)
          p.write_text(s2, encoding='utf-8')
          PY
          rm .github/workflows/repair-apply-execute.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Usar reemplazo estructural para executeCommand"
          git push origin HEAD:main
