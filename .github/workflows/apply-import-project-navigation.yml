name: Apply import and project navigation source
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-import-project-navigation.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged source patch
        run: python .github/scripts/apply_import_project_navigation.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/document.rs src/app.rs src/editor.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat: import TXT Markdown DOCX and project navigation"
          git pull --rebase origin main
          git push origin HEAD:main
