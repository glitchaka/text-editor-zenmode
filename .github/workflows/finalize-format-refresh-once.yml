name: Finalize format refresh once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-format-refresh-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy

      - name: Apply final patch
        shell: pwsh
        run: python .github/scripts/finalize_format_refresh.py

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        shell: pwsh
        run: cargo test

      - name: Build release
        shell: pwsh
        run: cargo build --release

      - name: Commit validated final state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize-format-refresh-once.yml
          git rm -f .github/scripts/finalize_format_refresh.py
          git add Cargo.toml Cargo.lock src/app.rs src/editor.rs src/spell.rs
          git commit -m "Finalizar formato visible, isla y cronómetro [skip ci]"
          git push origin HEAD:main
