name: Add terminal mouse bridge
on:
  push:
    branches: [main]
    paths: [.github/workflows/add-terminal-mouse-bridge.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bridge mouse selection and scrolling into Helix PTY
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/app.rs')
          s=p.read_text(encoding='utf-8')

          marker='''        callback key-input(string, bool, bool, bool);\n'''
          add='''        callback key-input(string, bool, bool, bool);\n        callback terminal-cell-has-text(float, float) -> bool;\n        callback terminal-pointer(float, float, int);\n        callback terminal-scroll(float, float, float);\n        property <bool> terminal-selecting: false;\n'''
          if 'callback terminal-pointer' not in s:
              if marker not in s: raise SystemExit('key callback marker missing')
              s=s.replace(marker,add,1)

          old='''        // The complete client surface is the native move area. Controls declared\n        // later stay above it and remain clickable. No fake titlebar or inset is reserved.\n        window-drag-surface := WindowMoveArea {\n            x: 0px;\n            y: 0px;\n            width: root.width;\n            height: root.height;\n            enabled: !root.zen-active;\n        }\n'''
          new='''        // The complete surface remains draggable. A drag that starts on rendered\n        // terminal text is reserved for Helix selection; blank surface keeps native window drag.\n        window-drag-surface := WindowMoveArea {\n            x: 0px;\n            y: 0px;\n            width: root.width;\n            height: root.height;\n            enabled: !root.zen-active && !root.terminal-selecting;\n\n            terminal-pointer-area := TouchArea {\n                pointer-event(event) => {\n                    if (event.button == PointerEventButton.left && event.kind == PointerEventKind.down) {\n                        root.terminal-selecting = root.editor-active\n                            && root.terminal-cell-has-text(self.mouse-x / 1px, self.mouse-y / 1px);\n                        if (root.editor-active) {\n                            root.terminal-pointer(self.mouse-x / 1px, self.mouse-y / 1px, 0);\n                        }\n                    } else if (event.button == PointerEventButton.left && event.kind == PointerEventKind.up) {\n                        if (root.editor-active) {\n                            root.terminal-pointer(self.mouse-x / 1px, self.mouse-y / 1px, 1);\n                        }\n                        root.terminal-selecting = false;\n                    } else if (event.kind == PointerEventKind.cancel) {\n                        root.terminal-selecting = false;\n                    }\n                }\n                moved => {\n                    if (root.editor-active && root.terminal-selecting && self.pressed) {\n                        root.terminal-pointer(self.mouse-x / 1px, self.mouse-y / 1px, 2);\n                    }\n                }\n                scroll-event(event) => {\n                    if (root.editor-active) {\n                        root.terminal-scroll(self.mouse-x / 1px, self.mouse-y / 1px, event.delta-y / 1px);\n                        accept\n                    } else {\n                        reject\n                    }\n                }\n            }\n        }\n'''
          if old not in s: raise SystemExit('window drag block missing')
          s=s.replace(old,new,1)

          # TerminalModel helpers: pixel -> vt cell and xterm SGR mouse reports.
          marker='''    fn render(&mut self) -> Image {'''
          helper=r'''    fn terminal_cell_at(&self, x: f32, y: f32) -> Option<(u16, u16)> {
        let scale = self.scale.max(0.5);
        let px = x * scale;
        let py = y * scale;
        let (left, top, cell_width, cell_height) = self.geometry();
        if px < left || py < top || cell_width <= 0.0 || cell_height <= 0.0 {
            return None;
        }
        let col = ((px - left) / cell_width).floor() as u16;
        let row = ((py - top) / cell_height).floor() as u16;
        let (rows, cols) = self.parser.screen().size();
        (row < rows && col < cols).then_some((row, col))
    }

    fn terminal_cell_has_text(&self, x: f32, y: f32) -> bool {
        let Some((row, col)) = self.terminal_cell_at(x, y) else {
            return false;
        };
        self.parser
            .screen()
            .cell(row, col)
            .is_some_and(|cell| !cell.is_wide_continuation() && !cell.contents().is_empty())
    }

    fn terminal_pointer(&mut self, x: f32, y: f32, kind: i32) {
        if self.pomodoro_break {
            return;
        }
        let Some((row, col)) = self.terminal_cell_at(x, y) else {
            return;
        };
        let Some(editor) = self.editor.as_ref() else {
            return;
        };
        let column = col as usize + 1;
        let line = row as usize + 1;
        let report = match kind {
            0 => format!("\x1b[<0;{column};{line}M"),
            1 => format!("\x1b[<0;{column};{line}m"),
            2 => format!("\x1b[<32;{column};{line}M"),
            _ => return,
        };
        let _ = editor.write_reply(report.as_bytes());
        self.dirty = true;
    }

    fn terminal_scroll(&mut self, x: f32, y: f32, delta_y: f32) {
        let Some((row, col)) = self.terminal_cell_at(x, y) else {
            return;
        };
        let Some(editor) = self.editor.as_ref() else {
            return;
        };
        let button = if delta_y < 0.0 { 64 } else { 65 };
        let column = col as usize + 1;
        let line = row as usize + 1;
        let report = format!("\x1b[<{button};{column};{line}M");
        let _ = editor.write_reply(report.as_bytes());
        self.dirty = true;
    }

'''
          if 'fn terminal_cell_at(&self' not in s:
              if marker not in s: raise SystemExit('render marker missing')
              s=s.replace(marker,helper+marker,1)

          # Wire Slint callbacks to the model.
          marker='''    {\n        let model = model.clone();\n        let weak = ui.as_weak();\n        ui.on_toggle_zen(move || {'''
          wiring='''    {\n        let model = model.clone();\n        ui.on_terminal_cell_has_text(move |x, y| model.borrow().terminal_cell_has_text(x, y));\n    }\n    {\n        let model = model.clone();\n        ui.on_terminal_pointer(move |x, y, kind| {\n            model.borrow_mut().terminal_pointer(x, y, kind);\n        });\n    }\n    {\n        let model = model.clone();\n        ui.on_terminal_scroll(move |x, y, delta_y| {\n            model.borrow_mut().terminal_scroll(x, y, delta_y);\n        });\n    }\n    {\n        let model = model.clone();\n        let weak = ui.as_weak();\n        ui.on_toggle_zen(move || {'''
          if 'ui.on_terminal_cell_has_text' not in s:
              if marker not in s: raise SystemExit('toggle zen wiring marker missing')
              s=s.replace(marker,wiring,1)

          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat: bridge mouse selection and scroll while preserving surface drag"
          git pull --rebase origin main
          git push origin HEAD:main
