name: Fix window drag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-window-drag.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drag target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/app.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(window-drag-strip := WindowMoveArea \{\s*\n\s*x: 7px;\s*\n\s*)y: 0px;(\s*\n\s*width: root\.width - 14px;\s*\n\s*)height: 12px;', re.M)
          text2, count = pattern.subn(r'\1y: 7px;\2height: 22px;', text, count=1)
          if count != 1:
              raise SystemExit(f'drag target replacement count={count}')
          path.write_text(text2, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add src/app.rs
          git commit -m "fix: make frameless window reliably draggable"
          git push origin HEAD:main
