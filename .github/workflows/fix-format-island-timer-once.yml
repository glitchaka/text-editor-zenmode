name: Fix format island timer once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-format-island-timer-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy

      - name: Apply patch
        shell: pwsh
        run: python .github/scripts/fix_live_format.py

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        shell: pwsh
        run: cargo test

      - name: Build release
        shell: pwsh
        run: cargo build --release

      - name: Commit validated fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-format-island-timer-once.yml
          git rm -f .github/scripts/fix_live_format.py
          git add Cargo.toml src/app.rs src/spell.rs
          git commit -m "Corregir formato visual, isla y cronómetro [skip ci]"
          git push origin HEAD:main
