name: Finish autocomplete and project lexicon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-autocomplete-project-lexicon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire LSP completion and project vocabulary
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/spell.rs')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '"codeActionProvider": true,\n                                "executeCommandProvider"',
              '"codeActionProvider": true,\n                                "completionProvider": { "resolveProvider": false },\n                                "executeCommandProvider"',
              1,
          )

          marker = '''            "textDocument/codeAction" => {\n                if let Some(id) = id {'''
          block = '''            "textDocument/completion" => {\n                if let Some(id) = id {\n                    let completions =\n                        server.completions(message.get("params").unwrap_or(&Value::Null));\n                    send_response(&mut output, id, Value::Array(completions))?;\n                }\n            }\n'''
          if '"textDocument/completion" =>' not in s:
              if marker not in s:
                  raise SystemExit('codeAction request marker missing')
              s = s.replace(marker, block + marker, 1)

          # Add same-project proper names to the live dictionary so names such as
          # Shuzún/Alvargio stop producing diagnostics and also participate in suggestions.
          old = '''        if let Ok(contents) = fs::read_to_string(&user_dictionary) {\n            for line in contents.lines() {\n                let word = line.trim();\n                if word.is_empty() || word.starts_with('#') {\n                    continue;\n                }\n                if dictionary.add(word).is_ok() {\n                    user_words.insert(word.to_lowercase());\n                }\n            }\n        }\n\n        Ok(Self {'''
          new = '''        if let Ok(contents) = fs::read_to_string(&user_dictionary) {\n            for line in contents.lines() {\n                let word = line.trim();\n                if word.is_empty() || word.starts_with('#') {\n                    continue;\n                }\n                if dictionary.add(word).is_ok() {\n                    user_words.insert(word.to_lowercase());\n                }\n            }\n        }\n\n        if let Some(root) = library_root.as_deref() {\n            for word in project_vocabulary(root, source_file.as_deref()) {\n                let _ = dictionary.add(&word);\n            }\n        }\n\n        Ok(Self {'''
          if old not in s:
              raise SystemExit('SpellServer::new dictionary marker missing')
          s = s.replace(old, new, 1)

          # Preserve relevance groups instead of alphabetical BTreeSet flattening.
          start = s.index('    fn completions(&self, params: &Value) -> Vec<Value> {')
          end = s.index('\n    fn semantic_tokens(&self, params: &Value)', start)
          replacement = r'''    fn completions(&self, params: &Value) -> Vec<Value> {
        let Some(uri) = params.pointer("/textDocument/uri").and_then(Value::as_str) else {
            return Vec::new();
        };
        let Some(text) = self.documents.get(uri) else {
            return Vec::new();
        };
        let line = params
            .pointer("/position/line")
            .and_then(Value::as_u64)
            .and_then(|value| usize::try_from(value).ok())
            .unwrap_or(0);
        let character = params
            .pointer("/position/character")
            .and_then(Value::as_u64)
            .and_then(|value| usize::try_from(value).ok())
            .unwrap_or(0);
        let prefix = word_prefix_at(text, line, character);
        if prefix.chars().count() < 2 {
            return Vec::new();
        }

        let mut ordered = Vec::<String>::new();
        let mut seen = HashSet::<String>::new();
        let mut push = |candidate: String| {
            let normalized = candidate.to_lowercase();
            if !candidate.eq_ignore_ascii_case(&prefix)
                && starts_with_case_insensitive(&candidate, &prefix)
                && seen.insert(normalized)
            {
                ordered.push(candidate);
            }
        };

        // 1. Words already used in the current document.
        let mut local = text
            .lines()
            .flat_map(word_ranges)
            .map(|(_, _, word)| word)
            .filter(|word| starts_with_case_insensitive(word, &prefix))
            .collect::<Vec<_>>();
        local.sort_by_key(|word| (word.len(), word.to_lowercase()));
        for word in local {
            push(word);
        }

        // 2. Same-project vocabulary and two-word proper-name phrases.
        if let Some(root) = self.library_root.as_ref() {
            let mut project = std::collections::BTreeSet::<String>::new();
            collect_library_words(
                root,
                self.source_file.as_deref(),
                text,
                &prefix,
                &mut project,
            );
            for candidate in project {
                push(candidate);
            }
            for phrase in project_phrases(root, self.source_file.as_deref(), &prefix) {
                push(phrase);
            }
        }

        // 3. Personal dictionary.
        let mut personal = self.user_words.iter().cloned().collect::<Vec<_>>();
        personal.sort();
        for word in personal {
            push(word);
        }

        // 4. Spell-derived candidates, deliberately capped so the popup never floods the editor.
        let mut spelling = Vec::new();
        self.dictionary.suggest(&prefix, &mut spelling);
        for suggestion in spelling.into_iter().take(6) {
            push(suggestion);
        }

        ordered
            .into_iter()
            .take(12)
            .enumerate()
            .map(|(index, label)| {
                json!({
                    "label": label,
                    "kind": 1,
                    "sortText": format!("{index:02}")
                })
            })
            .collect()
    }
'''
          s = s[:start] + replacement + s[end:]

          marker = '''fn collect_library_words(\n'''
          helpers = r'''fn project_vocabulary(
    root: &std::path::Path,
    source_file: Option<&std::path::Path>,
) -> Vec<String> {
    let current_project = source_file
        .and_then(crate::document::read_metadata)
        .map(|metadata| metadata.project)
        .unwrap_or_default();
    let Ok(entries) = std::fs::read_dir(root) else {
        return Vec::new();
    };
    let mut vocabulary = std::collections::BTreeSet::new();
    for entry in entries.flatten() {
        let path = entry.path();
        if !crate::document::is_native_path(&path) {
            continue;
        }
        let Ok(document) = crate::document::read(&path) else {
            continue;
        };
        if !current_project.trim().is_empty()
            && !document.metadata.project.eq_ignore_ascii_case(&current_project)
        {
            continue;
        }
        for (_, _, word) in document.body.lines().flat_map(word_ranges) {
            let proper = word.chars().next().is_some_and(char::is_uppercase);
            if proper && word.chars().filter(|ch| ch.is_alphabetic()).count() >= 3 {
                vocabulary.insert(word);
            }
        }
        for (_, _, word) in word_ranges(&document.metadata.title) {
            vocabulary.insert(word);
        }
    }
    vocabulary.into_iter().collect()
}

fn project_phrases(
    root: &std::path::Path,
    source_file: Option<&std::path::Path>,
    prefix: &str,
) -> Vec<String> {
    let current_project = source_file
        .and_then(crate::document::read_metadata)
        .map(|metadata| metadata.project)
        .unwrap_or_default();
    let Ok(entries) = std::fs::read_dir(root) else {
        return Vec::new();
    };
    let mut phrases = std::collections::BTreeSet::new();
    for entry in entries.flatten() {
        let path = entry.path();
        if !crate::document::is_native_path(&path) {
            continue;
        }
        let Ok(document) = crate::document::read(&path) else {
            continue;
        };
        if !current_project.trim().is_empty()
            && !document.metadata.project.eq_ignore_ascii_case(&current_project)
        {
            continue;
        }
        for line in document.body.lines() {
            let words = word_ranges(line)
                .into_iter()
                .map(|(_, _, word)| word)
                .collect::<Vec<_>>();
            for pair in words.windows(2) {
                if pair[0].chars().next().is_some_and(char::is_uppercase)
                    && pair[1].chars().next().is_some_and(char::is_uppercase)
                {
                    let phrase = format!("{} {}", pair[0], pair[1]);
                    if starts_with_case_insensitive(&phrase, prefix) {
                        phrases.insert(phrase);
                    }
                }
            }
        }
    }
    phrases.into_iter().collect()
}

'''
          if 'fn project_vocabulary(' not in s:
              if marker not in s:
                  raise SystemExit('collect_library_words marker missing')
              s = s.replace(marker, helpers + marker, 1)

          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Format
        run: cargo fmt --all
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spell.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire prioritized autocomplete and project lexicon"
          git pull --rebase origin main
          git push origin HEAD:main
