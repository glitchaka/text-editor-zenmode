name: Fix formatting without pipe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-format-no-pipe.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply source changes
        shell: bash
        run: python scripts/fix_format_no_pipe.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Commit final changes
        shell: bash
        run: |
          rm .github/workflows/fix-format-no-pipe.yml
          rm scripts/fix_format_no_pipe.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar pipe del formato HSST [skip ci]"
          git push origin HEAD:main
