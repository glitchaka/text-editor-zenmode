name: Apply rich export and import patches
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-export-import-patches.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged Python patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def execute_python_heredoc(path: str):
              text = Path(path).read_text(encoding='utf-8')
              block = text.split("python3 - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
              lines = block.splitlines()
              code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
              exec(compile(code, path, 'exec'), {'__name__': '__main__'})

          execute_python_heredoc('.github/workflows/finish-rich-export.yml')
          execute_python_heredoc('.github/workflows/import-docx-alignment.yml')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/export.rs src/document.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat: finish rich exports and DOCX alignment import"
          git pull --rebase origin main
          git push origin HEAD:main
