name: Finish format and Pomodoro once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-format-pomodoro-once.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Apply already validated source patch
        shell: pwsh
        run: |
          $workflow = Get-Content '.github/workflows/fix-format-pomodoro-once.yml' -Raw
          $match = [regex]::Match($workflow, '(?m)^\s*PATCH_B64:\s*(\S+)\s*$')
          if (-not $match.Success) { throw 'No se encontró PATCH_B64' }
          $bytes = [Convert]::FromBase64String($match.Groups[1].Value)
          $patch = Join-Path $env:RUNNER_TEMP 'fix.ps1'
          [IO.File]::WriteAllBytes($patch, $bytes)
          & $patch

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Clippy
        shell: pwsh
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        shell: pwsh
        run: cargo test

      - name: Build release
        shell: pwsh
        run: cargo build --release

      - name: Commit clean final state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-format-pomodoro-once.yml
          git rm -f .github/workflows/finish-format-pomodoro-once.yml
          if (Test-Path '.github/scripts/finalize_runtime.ps1') { git rm -f .github/scripts/finalize_runtime.ps1 }
          git add src/app.rs src/editor.rs src/spell.rs Cargo.toml
          git commit -m "Corregir formato real y retirar Pomodoro del launcher [skip ci]"
          git push origin HEAD:main
