name: Repair editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply repair
        run: python .github/repair_editor.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/repair_editor.py .github/workflows/repair-editor.yml
          git add -A
          git commit -m "fix: restore menu fullscreen and Helix credits [skip ci]"
          git push origin HEAD:main
