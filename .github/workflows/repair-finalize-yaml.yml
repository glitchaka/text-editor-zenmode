name: Repair Finalize Workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-finalize-yaml.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair block indentation
        shell: pwsh
        run: |
          $path = '.github/workflows/finalize-hsst-pomodoro.yml'
          $lines = [System.Collections.Generic.List[string]](Get-Content $path)
          $inside = $false
          $seenApply = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i]
            if ($line -eq '      - name: Apply final Rust changes') {
              $seenApply = $true
              continue
            }
            if ($seenApply -and $line -eq '        run: |') {
              $inside = $true
              $seenApply = $false
              continue
            }
            if ($inside -and $line -match '^      - name: ') {
              $inside = $false
            }
            if ($inside -and $line.Trim().Length -gt 0) {
              $leading = $line.Length - $line.TrimStart().Length
              if ($leading -lt 10) {
                $lines[$i] = (' ' * (10 - $leading)) + $line
              }
            }
          }
          [System.IO.File]::WriteAllLines($path, $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Commit repair
        shell: bash
        run: |
          rm .github/workflows/repair-finalize-yaml.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+glitchaka@users.noreply.github.com"
          git add -A
          git commit -m "Corregir workflow final de formato y Pomodoro"
          git push origin HEAD:main
