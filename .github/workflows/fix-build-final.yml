name: Apply final build cleanup

on:
  push:
    paths:
      - '.github/workflows/fix-build-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove remaining compiler warnings
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/app.rs')
          s = p.read_text(encoding='utf-8')
          old = '''            BringWindowToTop, GetForegroundWindow, GetWindowThreadProcessId, HWND_NOTOPMOST,
            HWND_TOPMOST, IsZoomed, SW_MAXIMIZE, SW_MINIMIZE, SW_RESTORE, SWP_NOACTIVATE,
            SWP_NOMOVE, SWP_NOSIZE, SetForegroundWindow, SetWindowPos, ShowWindow,
'''
          new = '''            BringWindowToTop, GetForegroundWindow, GetWindowThreadProcessId, HWND_NOTOPMOST,
            HWND_TOPMOST, SWP_NOACTIVATE, SWP_NOMOVE, SWP_NOSIZE, SetForegroundWindow,
            SetWindowPos,
'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/export.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'format::{ParagraphAlignment, StyledRun, TextStyle},',
              'format::{ParagraphAlignment, TextStyle},',
              1,
          )
          s = s.replace(
              '.find(|(start, end, _)| offset <= *start && *start <= line_end)',
              '.find(|(start, _end, _)| offset <= *start && *start <= line_end)',
              1,
          )
          p.write_text(s, encoding='utf-8')

      - name: Format
        run: cargo fmt --all

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/export.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: clear remaining Zen Editor build warnings"
          git push origin HEAD:main
