name: Repair native drag compile errors

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-native-drag-compile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch native drag imports and Slint event result
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.rs')
          t = p.read_text(encoding='utf-8')
          old = 'Input::KeyboardAndMouse::{GetAsyncKeyState, SetActiveWindow, SetFocus},'
          new = 'Input::KeyboardAndMouse::{GetAsyncKeyState, ReleaseCapture, SetActiveWindow, SetFocus},'
          if old not in t:
              raise SystemExit('keyboard import target missing')
          t = t.replace(old, new, 1)
          t = t.replace('HWND_NOTOPMOST, HWND_TOPMOST, ReleaseCapture, SWP_NOACTIVATE, SWP_NOMOVE, SWP_NOSIZE,',
                        'HWND_NOTOPMOST, HWND_TOPMOST, SWP_NOACTIVATE, SWP_NOMOVE, SWP_NOSIZE,', 1)
          drag = '''            pointer-event(event) => {\n                if event.button == PointerEventButton.left && event.kind == PointerEventKind.down {\n                    root.begin-window-drag();\n                    accept\n                } else {\n                    reject\n                }\n            }'''
          drag_fixed = '''            pointer-event(event) => {\n                if event.button == PointerEventButton.left && event.kind == PointerEventKind.down {\n                    root.begin-window-drag();\n                    EventResult.accept\n                } else {\n                    EventResult.reject\n                }\n            }'''
          if drag not in t:
              raise SystemExit('drag event target missing')
          t = t.replace(drag, drag_fixed, 1)
          p.write_text(t, encoding='utf-8', newline='\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add src/app.rs
          git commit -m "fix: compile native Win32 window drag"
          git push origin HEAD:main
