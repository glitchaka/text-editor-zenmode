name: Repair F2 borrow conflict
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-f2-borrow.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix borrow lifetime around F2 synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.rs')
          s=p.read_text(encoding='utf-8')
          old='''            if let Some(editor) = self.editor.as_mut() {\n                if native {\n                    // Helix edits a clean shadow file for native TXT/HSST documents.\n                    // Persist that live buffer and copy it back before asking the LSP\n                    // to mutate sidecar/container formatting. Otherwise F2 can act on\n                    // stale source offsets and appear to do nothing.\n                    if let Err(error) = editor.save_buffer_for_formatting() {\n                        self.launcher.message =\n                            Some(format!("No se pudo guardar antes de F2: {error}"));\n                        return;\n                    }\n                    let mut synced = false;\n                    for _ in 0..20 {\n                        std::thread::sleep(Duration::from_millis(10));\n                        match editor.sync_native() {\n                            Ok(true) => {\n                                synced = true;\n                                break;\n                            }\n                            Ok(false) => {}\n                            Err(error) => {\n                                self.launcher.message = Some(format!(\n                                    "No se pudo sincronizar el documento antes de F2: {error}"\n                                ));\n                                return;\n                            }\n                        }\n                    }\n                    if synced && let Some(source) = self.current_file.as_ref() {\n                        self.source_modified = fs::metadata(source)\n                            .and_then(|metadata| metadata.modified())\n                            .ok();\n                    }\n                }\n                if native {\n                    self.pending_style_snapshot = self.current_style_snapshot();\n                }\n                let _ = editor.send_key(key, editor.win32_input());\n            }'''
          new='''            if native {\n                if let Some(editor) = self.editor.as_mut() {\n                    // Helix edits a clean shadow file for native TXT/HSST documents.\n                    // Persist that live buffer and copy it back before asking the LSP\n                    // to mutate sidecar/container formatting. Otherwise F2 can act on\n                    // stale source offsets and appear to do nothing.\n                    if let Err(error) = editor.save_buffer_for_formatting() {\n                        self.launcher.message =\n                            Some(format!("No se pudo guardar antes de F2: {error}"));\n                        return;\n                    }\n                    let mut synced = false;\n                    for _ in 0..20 {\n                        std::thread::sleep(Duration::from_millis(10));\n                        match editor.sync_native() {\n                            Ok(true) => {\n                                synced = true;\n                                break;\n                            }\n                            Ok(false) => {}\n                            Err(error) => {\n                                self.launcher.message = Some(format!(\n                                    "No se pudo sincronizar el documento antes de F2: {error}"\n                                ));\n                                return;\n                            }\n                        }\n                    }\n                    if synced && let Some(source) = self.current_file.as_ref() {\n                        self.source_modified = fs::metadata(source)\n                            .and_then(|metadata| metadata.modified())\n                            .ok();\n                    }\n                }\n                // The mutable editor borrow is finished before reading the document snapshot.\n                self.pending_style_snapshot = self.current_style_snapshot();\n            }\n            if let Some(editor) = self.editor.as_ref() {\n                let _ = editor.send_key(key, editor.win32_input());\n            }'''
          if old not in s:
              raise SystemExit('F2 block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          cargo fmt --all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: end mutable editor borrow before F2 snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
