name: Fix HSST format visibility once

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Hide HSST markup in renderer
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # 1) format.rs: expose only the spans occupied by HSST implementation markers.
          path = Path("src/format.rs")
          text = path.read_text(encoding="utf-8")
          marker = '''#[cfg(test)]
          mod tests {
          '''
          addition = r'''pub fn markup_spans(line: &str) -> Vec<(usize, usize)> {
              let mut spans = Vec::new();
              push_delimiter_markup_spans(line, "**", &mut spans);
              push_delimiter_markup_spans(line, "__", &mut spans);
              push_delimiter_markup_spans(line, "==", &mut spans);
              push_single_asterisk_markup_spans(line, &mut spans);
              push_tag_markup_spans(line, "fg", &mut spans);
              push_tag_markup_spans(line, "bg", &mut spans);
              spans.sort_unstable();
              spans.dedup();
              spans
          }

          fn push_delimiter_markup_spans(
              line: &str,
              delimiter: &str,
              output: &mut Vec<(usize, usize)>,
          ) {
              let mut offset = 0usize;
              while let Some(open_rel) = line[offset..].find(delimiter) {
                  let open = offset + open_rel;
                  let inner_start = open + delimiter.len();
                  let Some(close_rel) = line[inner_start..].find(delimiter) else {
                      break;
                  };
                  let close = inner_start + close_rel;
                  if close > inner_start {
                      output.push((open, inner_start));
                      output.push((close, close + delimiter.len()));
                  }
                  offset = close + delimiter.len();
              }
          }

          fn push_single_asterisk_markup_spans(line: &str, output: &mut Vec<(usize, usize)>) {
              let bytes = line.as_bytes();
              let mut stars = Vec::new();
              for (index, byte) in bytes.iter().enumerate() {
                  if *byte != b'*' {
                      continue;
                  }
                  let previous = index.checked_sub(1).and_then(|i| bytes.get(i));
                  let next = bytes.get(index + 1);
                  if previous == Some(&b'*') || next == Some(&b'*') {
                      continue;
                  }
                  stars.push(index);
              }

              for pair in stars.as_chunks::<2>().0 {
                  if pair[1] > pair[0] + 1 {
                      output.push((pair[0], pair[0] + 1));
                      output.push((pair[1], pair[1] + 1));
                  }
              }
          }

          fn push_tag_markup_spans(line: &str, tag: &str, output: &mut Vec<(usize, usize)>) {
              let prefix = format!("{{{{{tag}:");
              let close = format!("{{{{/{tag}}}}}");
              let mut offset = 0usize;

              while let Some(open_rel) = line[offset..].find(&prefix) {
                  let open = offset + open_rel;
                  let Some(tag_end_rel) = line[open + prefix.len()..].find("}}") else {
                      break;
                  };
                  let tag_end = open + prefix.len() + tag_end_rel;
                  if PaletteColor::parse(&line[open + prefix.len()..tag_end]).is_none() {
                      offset = tag_end + 2;
                      continue;
                  }
                  let open_end = tag_end + 2;
                  output.push((open, open_end));

                  let Some(close_rel) = line[open_end..].find(&close) else {
                      break;
                  };
                  let close_start = open_end + close_rel;
                  output.push((close_start, close_start + close.len()));
                  offset = close_start + close.len();
              }
          }

          '''
          if "pub fn markup_spans(line: &str)" not in text:
              if marker not in text:
                  raise SystemExit("format.rs insertion point not found")
              text = text.replace(marker, addition + marker, 1)
          path.write_text(text, encoding="utf-8")

          # 2) app.rs: collapse those cells while rendering, so they consume no visual width.
          path = Path("src/app.rs")
          text = path.read_text(encoding="utf-8")

          old = '''        for row in 0..rows {
              for col in 0..cols {
                  let Some(cell) = screen.cell(row, col) else {
                      continue;
                  };
                  if cell.is_wide_continuation() {
                      continue;
                  }

                  let mut fg = terminal_color(cell.fgcolor(), FG);
          '''
          new = '''        for row in 0..rows {
              let hidden_markup = markup_hidden_columns(screen, row, cols);
              let mut hidden_before = 0u16;
              for col in 0..cols {
                  let Some(cell) = screen.cell(row, col) else {
                      continue;
                  };
                  if cell.is_wide_continuation() {
                      continue;
                  }

                  let visual_col = col.saturating_sub(hidden_before);
                  if hidden_markup.get(col as usize).copied().unwrap_or(false) {
                      if cursor_on && cursor == (row, col) {
                          let x = (left_pad + visual_col as f32 * cell_width).round() as i32;
                          let y = (top_pad + row as f32 * cell_height).round() as i32;
                          let h = cell_height.ceil() as i32;
                          fill_rect(
                              pixels,
                              (width, height),
                              (x, y, scale.round().max(1.0) as i32, h),
                              CURSOR,
                          );
                      }
                      hidden_before = hidden_before.saturating_add(1);
                      continue;
                  }

                  let mut fg = terminal_color(cell.fgcolor(), FG);
          '''
          if old not in text:
              raise SystemExit("render loop insertion point not found")
          text = text.replace(old, new, 1)

          old = '''                let x = (left_pad + col as f32 * cell_width).round() as i32;
          '''
          new = '''                let x = (left_pad + visual_col as f32 * cell_width).round() as i32;
          '''
          if old not in text:
              raise SystemExit("render x position not found")
          text = text.replace(old, new, 1)

          # Keep the working page wrap, but ignore invisible formatting metadata in its column count.
          old = '''        let Some((_, column)) = self.helix_cursor_position() else {
              return false;
          };
          // Helix reports a one-based insertion column. When it is already
          // beyond the printable width, the next character belongs on a real new line.
          if column <= limit {
              return false;
          }
          let Some(editor) = self.editor.as_ref() else {
              return false;
          };
          let win32 = editor.win32_input();

          if ch.is_whitespace() {
          '''
          new = '''        let prefix = self.helix_current_line_prefix().unwrap_or_default();
          let visible_before = crate::format::strip_markup(&prefix).chars().count();
          // Formatting metadata is zero-width from the writer's point of view.
          // Preserve the existing hard-wrap behavior using only visible characters.
          if visible_before < limit {
              return false;
          }
          let Some(editor) = self.editor.as_ref() else {
              return false;
          };
          let win32 = editor.win32_input();

          if ch.is_whitespace() {
          '''
          if old not in text:
              raise SystemExit("hard-wrap column block not found")
          text = text.replace(old, new, 1)

          old = '''        let prefix = self.helix_current_line_prefix().unwrap_or_default();
          if prefix.chars().any(char::is_whitespace) {
          '''
          new = '''        if crate::format::strip_markup(&prefix)
              .chars()
              .any(char::is_whitespace)
          {
          '''
          if old not in text:
              raise SystemExit("hard-wrap prefix block not found")
          text = text.replace(old, new, 1)

          marker = '''fn status_position(status: &str) -> Option<(usize, usize)> {
          '''
          helper = '''fn markup_hidden_columns(screen: &vt100::Screen, row: u16, cols: u16) -> Vec<bool> {
              let mut text = String::new();
              let mut cells = Vec::<(usize, usize, u16)>::new();

              for col in 0..cols {
                  let Some(cell) = screen.cell(row, col) else {
                      continue;
                  };
                  if cell.is_wide_continuation() {
                      continue;
                  }
                  let contents = cell.contents();
                  if contents.is_empty() {
                      continue;
                  }
                  let start = text.len();
                  text.push_str(contents);
                  cells.push((start, text.len(), col));
              }

              let spans = crate::format::markup_spans(&text);
              let mut hidden = vec![false; cols as usize];
              for (start, end, col) in cells {
                  if spans
                      .iter()
                      .any(|(left, right)| start < *right && end > *left)
                  {
                      hidden[col as usize] = true;
                  }
              }
              hidden
          }

          '''
          if "fn markup_hidden_columns(" not in text:
              if marker not in text:
                  raise SystemExit("app.rs helper insertion point not found")
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding="utf-8")
          '@ | python -

          cargo fmt --all
          cargo check

      - name: Commit fix and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-format-visibility-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/format.rs src/app.rs .github/workflows/fix-format-visibility-once.yml
          git commit -m "Ocultar marcas HSST sin afectar margenes"
          git push origin HEAD:main
