name: Repair format overlay lint errors
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-overlay-clippy.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch overlay lint errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.rs')
          t=p.read_text(encoding='utf-8')
          wrong='''    fn helix_status_text(&self) -> String {\n        let screen = self.parser.screen();\n        let format_overlay = self\n            .current_file\n            .as_ref()\n            .filter(|path| document::is_native_path(path))\n            .and_then(|path| document::read(path).ok())\n            .map(|document| native_format_overlay(screen, &document))\n            .unwrap_or_default();\n        let (rows, cols) = screen.size();'''
          fixed='''    fn helix_status_text(&self) -> String {\n        let screen = self.parser.screen();\n        let (rows, cols) = screen.size();'''
          if wrong not in t:
              raise SystemExit('helix_status_text erroneous overlay block missing')
          t=t.replace(wrong,fixed,1)

          marker='''fn match_source_row(\n    screen: &vt100::Screen,'''
          alias='''type ScreenCellMatch = (u16, usize, usize);\ntype ScreenRowMatch = (u16, Vec<ScreenCellMatch>);\n\n'''
          if alias not in t:
              if marker not in t:
                  raise SystemExit('match_source_row marker missing')
              t=t.replace(marker,alias+marker,1)
          t=t.replace(''') -> Option<(u16, Vec<(u16, usize, usize)>)> {''',''') -> Option<ScreenRowMatch> {''',1)
          t=t.replace('''    let mut best: Option<(u16, Vec<(u16, usize, usize)>)> = None;''','''    let mut best: Option<ScreenRowMatch> = None;''',1)
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit
        shell: bash
        run: |
          git config user.name glitchaka
          git config user.email 82622846+glitchaka@users.noreply.github.com
          git add src/app.rs
          git commit -m 'fix: clean HSST format overlay lint errors'
          git push origin HEAD:main
