name: Repair format UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-format-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app UI
        run: |
          echo '' | base64 -d | python3
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.rs
          git commit -m 'fix: restore formatting controls and palettes'
          git push
