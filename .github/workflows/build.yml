name: Build Zen Editor

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc
  EXE_NAME: zen-editor-windows-x86_64.exe

jobs:
  windows:
    name: Zen Editor Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply F2 borrow repair
        shell: pwsh
        run: |
          python .github/scripts/fix_f2_borrow.py
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: resolve F2 formatting borrow conflict"
            git push origin HEAD:main
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format source
        shell: pwsh
        run: cargo fmt --all

      - name: Clippy
        shell: pwsh
        run: cargo clippy --release --target $env:TARGET

      - name: Test
        shell: pwsh
        run: cargo test --release --target $env:TARGET

      - name: Build release
        shell: pwsh
        run: cargo build --release --target $env:TARGET

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $source = "target/$env:TARGET/release/zen-editor.exe"
          $target = "dist/$env:EXE_NAME"
          Copy-Item $source $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:EXE_NAME" | Set-Content "$target.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: zen-editor-windows-x86_64
          path: |
            dist/zen-editor-windows-x86_64.exe
            dist/zen-editor-windows-x86_64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/zen-editor-windows-x86_64.exe
            dist/zen-editor-windows-x86_64.exe.sha256
