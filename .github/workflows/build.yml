name: Build Helix-SST Zenmode

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "formatting-island"
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc
  EXE_NAME: helix-sst-zen-windows-x86_64.exe
  RUSTFLAGS: "-Dwarnings"

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Normalize formatting branch source
        if: github.ref == 'refs/heads/formatting-island'
        shell: pwsh
        run: |
          $path = "src/app.rs"
          $content = [System.IO.File]::ReadAllText($path)
          $content = $content.Replace("#8ec07c", "rgb(142, 192, 124)")
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))
          cargo fmt --all

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Aplicar rustfmt a isla de formato"
            git push origin HEAD:formatting-island
          }

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: pwsh
        run: cargo clippy --release --target $env:TARGET -- -D warnings

      - name: Test
        shell: pwsh
        run: cargo test --release --target $env:TARGET

      - name: Build release
        shell: pwsh
        run: cargo build --release --target $env:TARGET

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $source = "target/$env:TARGET/release/helix-sst-zen.exe"
          $target = "dist/$env:EXE_NAME"
          Copy-Item $source $target

          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:EXE_NAME" | Set-Content "$target.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: helix-sst-zen-windows-x86_64
          path: |
            dist/helix-sst-zen-windows-x86_64.exe
            dist/helix-sst-zen-windows-x86_64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/helix-sst-zen-windows-x86_64.exe
            dist/helix-sst-zen-windows-x86_64.exe.sha256
