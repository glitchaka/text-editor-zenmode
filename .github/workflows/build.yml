name: Apply Win32 format fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply source fix
        shell: pwsh
        run: python scripts/fix_win32_format.py

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Clippy
        shell: pwsh
        run: cargo clippy --release -- -D warnings

      - name: Build release
        shell: pwsh
        run: cargo build --release

      - name: Commit fix and restore workflow
        shell: bash
        run: |
          git checkout 35558cc1f04a60693b79172e5688f3988e103313 -- .github/workflows/build.yml
          rm scripts/fix_win32_format.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor.rs Cargo.toml .github/workflows/build.yml scripts/fix_win32_format.py
          git commit -m "Corregir comandos completos de formato en Windows [skip ci]"
          git push origin HEAD:main
