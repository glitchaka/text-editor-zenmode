name: Extend formatting regression coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extend-operational-color-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend operational color checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/verify_format_operational.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              '''    enum ExpectedStyle {\n        Bold,\n        Italic,\n        Underline,\n    }''',
              '''    enum ExpectedStyle {\n        Bold,\n        Italic,\n        Underline,\n        ForegroundRed,\n        BackgroundYellow,\n    }''',
              1,
          )
          t = t.replace(
              '''                    ExpectedStyle::Bold => cell.bold(),\n                    ExpectedStyle::Italic => cell.italic(),\n                    ExpectedStyle::Underline => cell.underline(),''',
              '''                    ExpectedStyle::Bold => cell.bold(),\n                    ExpectedStyle::Italic => cell.italic(),\n                    ExpectedStyle::Underline => cell.underline(),\n                    ExpectedStyle::ForegroundRed => matches!(\n                        cell.fgcolor(),\n                        vt100::Color::Rgb(0xfb, 0x49, 0x34)\n                    ),\n                    ExpectedStyle::BackgroundYellow => matches!(\n                        cell.bgcolor(),\n                        vt100::Color::Rgb(0xfa, 0xbd, 0x2f)\n                    ),''',
              1,
          )
          t = t.replace(
              '''            body: "NEGRITA CURSIVA SUBRAYADO".to_owned(),''',
              '''            body: "NEGRITA CURSIVA SUBRAYADO ROJO FONDO".to_owned(),''',
              1,
          )
          t = t.replace(
              '''                    {"start": 16, "end": 25, "underline": true}\n''',
              '''                    {"start": 16, "end": 25, "underline": true},\n                    {"start": 26, "end": 30, "foreground": "red"},\n                    {"start": 31, "end": 36, "background": "yellow"}\n''',
              1,
          )
          t = t.replace(
              '''        let mut underline = false;\n\n        while Instant::now() < deadline {''',
              '''        let mut underline = false;\n        let mut red = false;\n        let mut yellow_bg = false;\n\n        while Instant::now() < deadline {''',
              1,
          )
          t = t.replace(
              '''            underline = word_has_style(&session, "SUBRAYADO", ExpectedStyle::Underline);\n            if bold && italic && underline {''',
              '''            underline = word_has_style(&session, "SUBRAYADO", ExpectedStyle::Underline);\n            red = word_has_style(&session, "ROJO", ExpectedStyle::ForegroundRed);\n            yellow_bg = word_has_style(&session, "FONDO", ExpectedStyle::BackgroundYellow);\n            if bold && italic && underline && red && yellow_bg {''',
              1,
          )
          t = t.replace(
              '''        assert!(underline, "Helix no entrego atributo underline para SUBRAYADO");\n        let _ = fs::remove_dir_all(root);''',
              '''        assert!(underline, "Helix no entrego atributo underline para SUBRAYADO");\n        assert!(red, "Helix no entrego foreground rojo para ROJO");\n        assert!(yellow_bg, "Helix no entrego background amarillo para FONDO");\n        let _ = fs::remove_dir_all(root);''',
              1,
          )
          marker = '''    #[test]\n    fn live_hsst_format_reaches_terminal_attributes() {'''
          if marker not in t:
              raise SystemExit('live format test marker missing')
          if 'live_refresh_after_formatting_updates_terminal_color' not in t:
              insertion = r'''

    #[test]
    fn live_refresh_after_formatting_updates_terminal_color() {
        let root = std::env::temp_dir().join(format!(
            "helix-sst-live-refresh-color-{}",
            std::process::id()
        ));
        let _ = fs::remove_dir_all(&root);
        fs::create_dir_all(&root).expect("crear directorio temporal");
        let path = root.join("dynamic-color.hsst");
        let document = document::HsstDocument {
            metadata: document::DocumentMetadata::new("dynamic-color"),
            body: "DINAMICO".to_owned(),
            formatting: serde_json::json!({"version": 1, "unit": "utf8-byte", "runs": []}),
        };
        document::write(&path, &document).expect("crear HSST dinamico");
        let session = EditorSession::start(&path, 100, 28).expect("arrancar Helix real en PTY");

        let startup_deadline = Instant::now() + Duration::from_secs(10);
        while Instant::now() < startup_deadline {
            while let Some(result) = session.try_output() {
                result.expect("salida de Helix valida");
            }
            if session.protocol.lock().unwrap_or_else(|e| e.into_inner()).screen().contents().contains("DINAMICO") {
                break;
            }
            thread::sleep(Duration::from_millis(100));
        }

        assert!(document::apply_format_lsp_range(
            &path,
            "DINAMICO",
            0,
            0,
            0,
            8,
            "font-color",
            "red",
        ).expect("aplicar color externo"));
        session.refresh_after_formatting().expect("refrescar formato");

        let deadline = Instant::now() + Duration::from_secs(15);
        let mut red = false;
        while Instant::now() < deadline {
            while let Some(result) = session.try_output() {
                result.expect("salida de Helix valida");
            }
            red = word_has_style(&session, "DINAMICO", ExpectedStyle::ForegroundRed);
            if red {
                break;
            }
            thread::sleep(Duration::from_millis(100));
        }
        let _ = session.send_command(":quit!");
        assert!(red, "El refresco tras F2 no llevo el color al terminal");
        let _ = fs::remove_dir_all(root);
    }
'''
              end_marker = '''    #[test]\n    fn live_hsst_format_reaches_terminal_attributes() {'''
              t = t.replace(end_marker, insertion + '\n' + end_marker, 1)

          p.write_text(t, encoding='utf-8', newline='\n')
          PY
      - name: Commit tests
        shell: bash
        run: |
          git config user.name "glitchaka"
          git config user.email "82622846+glitchaka@users.noreply.github.com"
          git add .github/scripts/verify_format_operational.py
          git commit -m "test: verify F2 colors and live refresh"
          git push origin HEAD:main
