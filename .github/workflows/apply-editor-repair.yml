name: Apply editor repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply patches
        run: |
          python3 .github/fix_ui.py
          python3 .github/fix_projects.py
          cargo fmt --all
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix_ui.py .github/fix_projects.py .github/workflows/apply-editor-repair.yml
          git add src/app.rs src/editor.rs src/document.rs Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "fix: clear F2 remnants and add folder/project grouping [skip ci]"
          git push origin HEAD:main
