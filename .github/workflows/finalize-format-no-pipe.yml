name: Finalize format no pipe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-format-no-pipe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source changes
        run: python scripts/finalize_format_no_pipe.py
      - name: Format
        run: cargo fmt --all
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/finalize-format-no-pipe.yml
          rm scripts/finalize_format_no_pipe.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cerrar formato HSST sin pipe [skip ci]"
          git push origin HEAD:main
