name: Synchronize native document before F2
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-f2-native-sync.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Synchronize live Helix buffer before F2 LSP actions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.rs')
          s=p.read_text(encoding='utf-8')

          marker='''        if key.code == KeyCode::F(4) && key.modifiers.is_empty() {\n            self.start_pomodoro();\n            return;\n        }\n'''
          addition='''        if key.code == KeyCode::F(4) && key.modifiers.is_empty() {\n            self.start_pomodoro();\n            return;\n        }\n        if key.code == KeyCode::F(2) && key.modifiers.is_empty() {\n            let native = self\n                .current_file\n                .as_ref()\n                .is_some_and(|path| document::is_native_path(path));\n            if let Some(editor) = self.editor.as_mut() {\n                if native {\n                    // Helix edits a clean shadow file for native TXT/HSST documents.\n                    // Persist that live buffer and copy it back before asking the LSP\n                    // to mutate sidecar/container formatting. Otherwise F2 can act on\n                    // stale source offsets and appear to do nothing.\n                    if let Err(error) = editor.save_buffer_for_formatting() {\n                        self.launcher.message =\n                            Some(format!("No se pudo guardar antes de F2: {error}"));\n                        return;\n                    }\n                    let mut synced = false;\n                    for _ in 0..20 {\n                        std::thread::sleep(Duration::from_millis(10));\n                        match editor.sync_native() {\n                            Ok(true) => {\n                                synced = true;\n                                break;\n                            }\n                            Ok(false) => {}\n                            Err(error) => {\n                                self.launcher.message = Some(format!(\n                                    "No se pudo sincronizar el documento antes de F2: {error}"\n                                ));\n                                return;\n                            }\n                        }\n                    }\n                    if synced\n                        && let Some(source) = self.current_file.as_ref()\n                    {\n                        self.source_modified = fs::metadata(source)\n                            .and_then(|metadata| metadata.modified())\n                            .ok();\n                    }\n                }\n                let _ = editor.send_key(key, editor.win32_input());\n            }\n            return;\n        }\n'''
          if 'stale source offsets' not in s:
              if marker not in s: raise SystemExit('F4 marker missing')
              s=s.replace(marker,addition,1)

          # No page palette exists anymore; drop its stale state flag.
          s=s.replace('        property <bool> page-menu-open: false;\n','')
          s=s.replace('                        root.page-menu-open = false;\n','')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          cargo fmt --all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "fix: synchronize native text before F2 actions"
          git pull --rebase origin main
          git push origin HEAD:main
