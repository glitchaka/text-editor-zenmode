name: Fix live editor regressions
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-live-editor-regressions.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix native corners and post-format editor state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Editor helper: after an F2 sidecar-format command, forcibly dismiss
          # every Helix popup/selection state and return to insert mode.
          p = Path('src/editor.rs')
          s = p.read_text(encoding='utf-8')
          marker = '''    pub fn refresh_after_formatting(&self) -> Result<()> {\n'''
          helper = '''    pub fn finish_formatting_action(&self) -> Result<()> {\n        let win32 = self.win32_input();\n        // First Esc closes the code-action/menu popup; the second leaves Select mode.\n        // Then return to insert mode so the next printable key is text, not a Helix\n        // normal-mode command such as `.` (repeat last change).\n        self.send_key(KeyEvent::new(KeyCode::Esc, KeyModifiers::NONE), win32)?;\n        self.send_key(KeyEvent::new(KeyCode::Esc, KeyModifiers::NONE), win32)?;\n        self.send_key(KeyEvent::new(KeyCode::Char('i'), KeyModifiers::NONE), win32)?;\n        Ok(())\n    }\n\n'''
          if 'pub fn finish_formatting_action' not in s:
              if marker not in s:
                  raise SystemExit('refresh_after_formatting marker missing')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          # App: close the menu and normalize mode immediately after an F2
          # formatting/page sidecar mutation is observed.
          p = Path('src/app.rs')
          s = p.read_text(encoding='utf-8')
          old = '''                    if let Ok(changed_document) = document::read(source) {\n                        self.page_profile = changed_document.metadata.page;\n                        if let Some(before) = self.pending_style_snapshot.take() {\n                            let after = StyleSnapshot::from_document(&changed_document);\n                            if before.formatting != after.formatting || before.page != after.page {\n                                self.style_undo.push(before);\n                                self.style_redo.clear();\n                            }\n                        }\n                    }\n                    // F2 may change formatting.json or page metadata without terminal text.\n                    self.dirty = true;\n                    if let Err(error) = editor.refresh_after_formatting() {\n                        self.launcher.message =\n                            Some(format!("No se pudo refrescar el formato: {error}"));\n                    }\n'''
          new = '''                    let mut f2_sidecar_changed = false;\n                    if let Ok(changed_document) = document::read(source) {\n                        self.page_profile = changed_document.metadata.page;\n                        if let Some(before) = self.pending_style_snapshot.take() {\n                            let after = StyleSnapshot::from_document(&changed_document);\n                            if before.formatting != after.formatting || before.page != after.page {\n                                self.style_undo.push(before);\n                                self.style_redo.clear();\n                                f2_sidecar_changed = true;\n                            }\n                        }\n                    }\n                    // F2 may change formatting.json or page metadata without terminal text.\n                    self.dirty = true;\n                    if let Err(error) = editor.refresh_after_formatting() {\n                        self.launcher.message =\n                            Some(format!("No se pudo refrescar el formato: {error}"));\n                    }\n                    if f2_sidecar_changed {\n                        if let Err(error) = editor.finish_formatting_action() {\n                            self.launcher.message = Some(format!(\n                                "No se pudo cerrar F2 y volver a escritura: {error}"\n                            ));\n                        }\n                    }\n'''
          if old not in s:
              raise SystemExit('F2 sidecar watcher block missing')
          s = s.replace(old, new, 1)

          # Re-assert the Windows 11 DWM corner preference while the custom
          # frameless window is in normal mode. Winit/Slint can recreate/update
          # native window state during resize/focus transitions; this keeps the
          # native DWM rounding authoritative without masks or fake clipping.
          old = '''            #[cfg(windows)]\n            if zen\n                && let Some(hwnd) = slint_hwnd(&ui)\n                && unsafe { GetForegroundWindow() != hwnd }\n            {\n                unsafe {\n                    focus_native_window(hwnd);\n                }\n            }\n'''
          new = '''            #[cfg(windows)]\n            if let Some(hwnd) = slint_hwnd(&ui) {\n                unsafe {\n                    if zen {\n                        if GetForegroundWindow() != hwnd {\n                            focus_native_window(hwnd);\n                        }\n                    } else {\n                        enable_native_rounded_corners(hwnd);\n                    }\n                }\n            }\n'''
          if old not in s:
              raise SystemExit('Windows focus block missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          cargo fmt --all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/editor.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore native corners and normalize state after F2 formatting"
          git pull --rebase origin main
          git push origin HEAD:main
