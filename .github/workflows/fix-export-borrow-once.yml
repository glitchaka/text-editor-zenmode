name: Fix export borrow once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fix export borrow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/export.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('title: document.metadata.title,\n            body: document::rich_body(&document),', 'title: document.metadata.title.clone(),\n            body: document::rich_body(&document),', 1)
          s = s.replace('title: current.metadata.title,\n            body: document::rich_body(&current),', 'title: current.metadata.title.clone(),\n            body: document::rich_body(&current),', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/export.rs
          git commit -m "Corregir préstamos en exportación HSST"
          git push origin HEAD:main
