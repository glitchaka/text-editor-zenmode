name: Preserve DOCX paragraph alignment
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-docx-alignment.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import DOCX paragraph alignment into HSST metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/document.rs')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              '''    let mut rich = String::new();\n    let mut cursor = 0usize;''',
              '''    let mut rich = String::new();\n    let mut cursor = 0usize;\n    let mut plain_offset = 0usize;\n    let mut paragraph_alignments = Vec::<(usize, usize, crate::format::ParagraphAlignment)>::new();''',
              1,
          )

          old='''        if !rich.is_empty() {\n            rich.push('\\n');\n        }\n\n        let paragraph_style =\n            xml_attr_after(paragraph, "<w:pStyle", "w:val").unwrap_or_default();'''
          new='''        if !rich.is_empty() {\n            rich.push('\\n');\n            plain_offset += 1;\n        }\n        let paragraph_plain_start = plain_offset;\n        let mut paragraph_plain_len = 0usize;\n        let paragraph_alignment = xml_attr_after(paragraph, "<w:jc", "w:val")\n            .as_deref()\n            .and_then(crate::format::ParagraphAlignment::parse)\n            .unwrap_or_default();\n\n        let paragraph_style =\n            xml_attr_after(paragraph, "<w:pStyle", "w:val").unwrap_or_default();'''
          if old not in s: raise SystemExit('DOCX paragraph start marker missing')
          s=s.replace(old,new,1)

          s=s.replace(
              '''        {\n            rich.push_str("# ");\n        } else if paragraph_style.eq_ignore_ascii_case("Heading2") {\n            rich.push_str("## ");\n        } else if paragraph_style.eq_ignore_ascii_case("Heading3") {\n            rich.push_str("### ");\n        }''',
              '''        {\n            rich.push_str("# ");\n            paragraph_plain_len += 2;\n        } else if paragraph_style.eq_ignore_ascii_case("Heading2") {\n            rich.push_str("## ");\n            paragraph_plain_len += 3;\n        } else if paragraph_style.eq_ignore_ascii_case("Heading3") {\n            rich.push_str("### ");\n            paragraph_plain_len += 4;\n        }''',
              1,
          )

          old='''                rich.push_str(&encode_styled_segment(&text, style));\n            }\n            run_cursor = run_end + "</w:r>".len();\n        }\n        cursor = end + "</w:p>".len();'''
          new='''                rich.push_str(&encode_styled_segment(&text, style));\n                paragraph_plain_len += text.len();\n            }\n            run_cursor = run_end + "</w:r>".len();\n        }\n        let paragraph_plain_end = paragraph_plain_start + paragraph_plain_len;\n        if paragraph_alignment != crate::format::ParagraphAlignment::Left {\n            paragraph_alignments.push((paragraph_plain_start, paragraph_plain_end, paragraph_alignment));\n        }\n        plain_offset = paragraph_plain_end;\n        cursor = end + "</w:p>".len();'''
          if old not in s: raise SystemExit('DOCX run end marker missing')
          s=s.replace(old,new,1)

          old='''    Ok(formatting_payload(&rich))\n}'''
          new='''    let (body, formatting) = formatting_payload(&rich);\n    let runs = decode_formatting_runs(&formatting);\n    Ok((body, encode_formatting_parts(&runs, &paragraph_alignments)))\n}'''
          if old not in s: raise SystemExit('DOCX import return marker missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/document.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat: preserve DOCX paragraph alignment during import"
          git pull --rebase origin main
          git push origin HEAD:main
