name: Direct DOCX open
on:
  push:
    branches: [main]
    paths: [.github/workflows/direct-docx-open.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Import DOCX passed directly to the executable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.rs')
          s=p.read_text(encoding='utf-8')
          old='''        if let Some(file) = file_to_open {\n            this.open_editor(file)?;\n        } else {\n            this.render_splash();\n        }'''
          new='''        if let Some(file) = file_to_open {\n            let direct_file = if file\n                .extension()\n                .and_then(|value| value.to_str())\n                .is_some_and(|value| value.eq_ignore_ascii_case("docx"))\n            {\n                document::import_to_native(&file, &this.library.documents)\n                    .with_context(|| format!("No se pudo importar {}", file.display()))?\n            } else {\n                file\n            };\n            this.open_editor(direct_file)?;\n        } else {\n            this.render_splash();\n        }'''
          if old not in s: raise SystemExit('initial open marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          cargo fmt --all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "feat: import DOCX when opened directly"
          git pull --rebase origin main
          git push origin HEAD:main
