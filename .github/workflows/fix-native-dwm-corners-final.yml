name: Fix native DWM corners final
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-native-dwm-corners-final.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply native DWM corners after window creation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.rs')
          s=p.read_text(encoding='utf-8')

          # Remove the stale Win32 drag-only import left behind by the old implementation.
          s=s.replace(', WM_NCLBUTTONDOWN','')

          marker='''#[cfg(windows)]\nfn slint_hwnd(ui: &ZenWindow) -> Option<HWND> {\n'''
          native='''#[cfg(windows)]\n#[link(name = "dwmapi")]\nunsafe extern "system" {\n    fn DwmSetWindowAttribute(\n        hwnd: HWND,\n        attribute: u32,\n        value: *const std::ffi::c_void,\n        value_size: u32,\n    ) -> i32;\n}\n\n#[cfg(windows)]\nunsafe fn enable_native_rounded_corners(hwnd: HWND) {\n    const DWMWA_WINDOW_CORNER_PREFERENCE: u32 = 33;\n    const DWMWCP_ROUND: u32 = 2;\n    let preference = DWMWCP_ROUND;\n    unsafe {\n        let _ = DwmSetWindowAttribute(\n            hwnd,\n            DWMWA_WINDOW_CORNER_PREFERENCE,\n            (&preference as *const u32).cast(),\n            std::mem::size_of::<u32>() as u32,\n        );\n    }\n}\n\n#[cfg(windows)]\nfn slint_hwnd(ui: &ZenWindow) -> Option<HWND> {\n'''
          if 'DwmSetWindowAttribute' not in s:
              if marker not in s:
                  raise SystemExit('slint_hwnd marker not found')
              s=s.replace(marker,native,1)

          create='''    let ui = ZenWindow::new()?;\n'''
          hook='''    let ui = ZenWindow::new()?;\n\n    #[cfg(windows)]\n    {\n        let weak = ui.as_weak();\n        Timer::single_shot(Duration::from_millis(0), move || {\n            if let Some(ui) = weak.upgrade()\n                && let Some(hwnd) = slint_hwnd(&ui)\n            {\n                unsafe {\n                    enable_native_rounded_corners(hwnd);\n                }\n            }\n        });\n    }\n'''
          if 'enable_native_rounded_corners(hwnd)' not in s.split('pub fn run',1)[-1]:
              if create not in s:
                  raise SystemExit('ZenWindow creation marker not found')
              s=s.replace(create,hook,1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          cargo fmt --all
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore native Windows rounded corners"
          git push origin HEAD:main
