name: Apply format no pipe now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-format-no-pipe-now.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source changes
        run: python scripts/fix_format_no_pipe.py
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          rm -f .github/workflows/fix-format-no-pipe.yml
          rm -f .github/workflows/apply-format-no-pipe-now.yml
          rm -f scripts/fix_format_no_pipe.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Eliminar pipe del formato HSST [skip ci]"
          git push origin HEAD:main
