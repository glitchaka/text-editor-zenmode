    branches: [main]
    paths: [.github/workflows/finish-rich-export.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve inline format and paragraph alignment in exports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/export.rs')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              'use crate::{document, page::PageProfile};',
              'use crate::{document, format::{ParagraphAlignment, StyledRun, TextStyle}, page::PageProfile};',
              1,
          )

          old='''struct ExportDocument {\n    title: String,\n    body: String,\n    page: PageProfile,\n}'''
          new='''struct ExportDocument {\n    title: String,\n    body: String,\n    page: PageProfile,\n    alignments: Vec<ParagraphAlignment>,\n}'''
          if old not in s: raise SystemExit('ExportDocument marker missing')
          s=s.replace(old,new,1)

          old='''        return Ok(ExportDocument {\n            title: document.metadata.title.clone(),\n            body: document::rich_body(&document),\n            page: document.metadata.page,\n        });'''
          new='''        let alignments = export_line_alignments(&document);\n        return Ok(ExportDocument {\n            title: document.metadata.title.clone(),\n            body: document::rich_body(&document),\n            page: document.metadata.page,\n            alignments,\n        });'''
          if old not in s: raise SystemExit('native ExportDocument marker missing')
          s=s.replace(old,new,1)

          s=s.replace(
              '''    Ok(ExportDocument {\n        title,\n        body,\n        page: PageProfile::default(),\n    })''',
              '''    let alignments = body.lines().map(|_| ParagraphAlignment::Left).collect();\n    Ok(ExportDocument {\n        title,\n        body,\n        page: PageProfile::default(),\n        alignments,\n    })''',
              1,
          )

          old='''            Ok(ExportDocument {\n                title: metadata.title,\n                body: document::rich_body(&document),\n                page: document.metadata.page,\n            })'''
          new='''            let alignments = export_line_alignments(&document);\n            Ok(ExportDocument {\n                title: metadata.title,\n                body: document::rich_body(&document),\n                page: document.metadata.page,\n                alignments,\n            })'''
          if old not in s: raise SystemExit('project ExportDocument marker missing')
          s=s.replace(old,new,1)

          old='''        return Ok(vec![ExportDocument {\n            title: current.metadata.title.clone(),\n            body: document::rich_body(&current),\n            page: current.metadata.page,\n        }]);'''
          new='''        let alignments = export_line_alignments(&current);\n        return Ok(vec![ExportDocument {\n            title: current.metadata.title.clone(),\n            body: document::rich_body(&current),\n            page: current.metadata.page,\n            alignments,\n        }]);'''
          if old not in s: raise SystemExit('fallback project ExportDocument marker missing')
          s=s.replace(old,new,1)

          marker='''fn write_txt(target: &Path, documents: &[ExportDocument]) -> Result<()> {'''
          helper=r'''fn export_line_alignments(document: &document::HsstDocument) -> Vec<ParagraphAlignment> {
    let ranges = document::paragraph_alignments(document);
    let mut result = Vec::new();
    let mut offset = 0usize;
    for segment in document.body.split_inclusive('\n') {
        let line = segment.strip_suffix('\n').unwrap_or(segment);
        let line_end = offset + line.len();
        let alignment = ranges
            .iter()
            .rev()
            .find(|(start, end, _)| *start <= offset && offset <= *end)
            .or_else(|| ranges.iter().rev().find(|(start, end, _)| offset <= *start && *start <= line_end))
            .map(|(_, _, alignment)| *alignment)
            .unwrap_or_default();
        result.push(alignment);
        offset += segment.len();
    }
    if document.body.is_empty() {
        result.push(ParagraphAlignment::Left);
    }
    result
}

fn docx_justification(alignment: ParagraphAlignment) -> &'static str {
    match alignment {
        ParagraphAlignment::Left => "left",
        ParagraphAlignment::Center => "center",
        ParagraphAlignment::Right => "right",
        ParagraphAlignment::Justify => "both",
    }
}

'''
          if 'fn export_line_alignments' not in s:
              if marker not in s: raise SystemExit('write_txt marker missing')
              s=s.replace(marker,helper+marker,1)

          # DOCX: alignment is real paragraph metadata, not spaces.
          s=s.replace(
              'xml.push_str(&paragraph_xml(&document.title, Some("Heading1")));',
              'xml.push_str(&paragraph_xml(&document.title, Some("Heading1"), ParagraphAlignment::Left));',
              1,
          )
          old='''        for line in document.body.lines() {\n            if let Some(heading) = line.strip_prefix("# ") {\n                xml.push_str(&paragraph_xml(heading, Some("Heading1")));\n            } else {\n                xml.push_str(&rich_paragraph_xml(line));\n            }\n        }'''
          new='''        for (line_index, line) in document.body.lines().enumerate() {\n            let alignment = document\n                .alignments\n                .get(line_index)\n                .copied()\n                .unwrap_or_default();\n            if let Some(heading) = line.strip_prefix("# ") {\n                xml.push_str(&paragraph_xml(heading, Some("Heading1"), alignment));\n            } else {\n                xml.push_str(&rich_paragraph_xml(line, alignment));\n            }\n        }'''
          if old not in s: raise SystemExit('DOCX body loop missing')
          s=s.replace(old,new,1)

          old='''fn paragraph_xml(text: &str, style: Option<&str>) -> String {\n    let style = style\n        .map(|style| format!(r#"<w:pPr><w:pStyle w:val="{style}"/></w:pPr>"#))\n        .unwrap_or_default();\n    format!(\n        r#"<w:p>{style}<w:r><w:t xml:space="preserve">{}</w:t></w:r></w:p>"#,\n        xml_escape(text)\n    )\n}\n\nfn rich_paragraph_xml(line: &str) -> String {\n    let runs = crate::format::styled_runs(line);\n    let mut xml = String::from("<w:p>");'''
          new='''fn paragraph_xml(text: &str, style: Option<&str>, alignment: ParagraphAlignment) -> String {\n    let mut paragraph = String::from("<w:pPr>");\n    if let Some(style) = style {\n        paragraph.push_str(&format!(r#"<w:pStyle w:val="{style}"/>"#));\n    }\n    paragraph.push_str(&format!(r#"<w:jc w:val="{}"/>"#, docx_justification(alignment)));\n    paragraph.push_str("</w:pPr>");\n    format!(\n        r#"<w:p>{paragraph}<w:r><w:t xml:space="preserve">{}</w:t></w:r></w:p>"#,\n        xml_escape(text)\n    )\n}\n\nfn rich_paragraph_xml(line: &str, alignment: ParagraphAlignment) -> String {\n    let runs = crate::format::styled_runs(line);\n    let mut xml = format!(r#"<w:p><w:pPr><w:jc w:val="{}"/></w:pPr>"#, docx_justification(alignment));'''
          if old not in s: raise SystemExit('paragraph functions marker missing')
          s=s.replace(old,new,1)

          # Replace the plain PDF writer with a rich-run renderer.
          start=s.index('fn write_pdf(target: &Path, documents: &[ExportDocument]) -> Result<()> {')
          end=s.index('\nfn pdf_escape_text(', start)
          replacement=r'''#[derive(Clone)]
struct PdfFragment {
    text: String,
    style: TextStyle,
}

#[derive(Clone)]
struct PdfVisualLine {
    fragments: Vec<PdfFragment>,
    alignment: ParagraphAlignment,
    justify: bool,
}

fn merge_pdf_chars(chars: &[(char, TextStyle)]) -> Vec<PdfFragment> {
    let mut output = Vec::<PdfFragment>::new();
    for &(ch, style) in chars {
        if let Some(last) = output.last_mut()
            && last.style == style
        {
            last.text.push(ch);
        } else {
            output.push(PdfFragment { text: ch.to_string(), style });
        }
    }
    output
}

fn wrap_pdf_rich_line(
    line: &str,
    width: usize,
    alignment: ParagraphAlignment,
) -> Vec<PdfVisualLine> {
    if line.is_empty() {
        return vec![PdfVisualLine {
            fragments: Vec::new(),
            alignment,
            justify: false,
        }];
    }
    let mut chars = Vec::<(char, TextStyle)>::new();
    for run in crate::format::styled_runs(line) {
        chars.extend(run.text.chars().map(|ch| (ch, run.style)));
    }
    if chars.is_empty() {
        return vec![PdfVisualLine {
            fragments: Vec::new(),
            alignment,
            justify: false,
        }];
    }

    let mut output = Vec::new();
    let mut cursor = 0usize;
    while cursor < chars.len() {
        let remaining = chars.len() - cursor;
        if remaining <= width {
            output.push(PdfVisualLine {
                fragments: merge_pdf_chars(&chars[cursor..]),
                alignment,
                justify: false,
            });
            break;
        }
        let hard_end = (cursor + width).min(chars.len());
        let split = chars[cursor..hard_end]
            .iter()
            .rposition(|(ch, _)| ch.is_whitespace())
            .filter(|relative| *relative > 0)
            .map(|relative| cursor + relative)
            .unwrap_or(hard_end);
        output.push(PdfVisualLine {
            fragments: merge_pdf_chars(&chars[cursor..split]),
            alignment,
            justify: alignment == ParagraphAlignment::Justify,
        });
        cursor = split;
        while cursor < chars.len() && chars[cursor].0.is_whitespace() {
            cursor += 1;
        }
    }
    output
}

fn pdf_color(color: crate::format::PaletteColor) -> (f32, f32, f32) {
    use crate::format::PaletteColor as C;
    match color {
        C::White => (0.92, 0.88, 0.75),
        C::Red => (0.98, 0.29, 0.20),
        C::Orange => (1.00, 0.50, 0.10),
        C::Yellow => (0.98, 0.74, 0.18),
        C::Green => (0.72, 0.73, 0.15),
        C::Cyan => (0.56, 0.75, 0.49),
        C::Blue => (0.51, 0.65, 0.60),
        C::Purple => (0.83, 0.53, 0.61),
        C::Gray => (0.57, 0.51, 0.45),
    }
}

fn pdf_font_name(style: TextStyle) -> &'static str {
    match (style.bold, style.italic) {
        (true, true) => "F4",
        (true, false) => "F2",
        (false, true) => "F3",
        (false, false) => "F1",
    }
}

fn pdf_line_plain_width(line: &PdfVisualLine, char_width: f32) -> f32 {
    line.fragments
        .iter()
        .map(|fragment| fragment.text.chars().count() as f32 * char_width)
        .sum()
}

fn pdf_line_stream(
    line: &PdfVisualLine,
    y: f32,
    margin_left: f32,
    content_width: f32,
    font_size: f32,
) -> String {
    let char_width = font_size * 0.60;
    let plain_width = pdf_line_plain_width(line, char_width);
    let mut x = match line.alignment {
        ParagraphAlignment::Left | ParagraphAlignment::Justify => margin_left,
        ParagraphAlignment::Center => margin_left + ((content_width - plain_width) / 2.0).max(0.0),
        ParagraphAlignment::Right => margin_left + (content_width - plain_width).max(0.0),
    };
    let spaces = line
        .fragments
        .iter()
        .map(|fragment| fragment.text.chars().filter(|ch| ch.is_whitespace()).count())
        .sum::<usize>();
    let extra_space = if line.justify && spaces > 0 {
        ((content_width - plain_width) / spaces as f32).max(0.0)
    } else {
        0.0
    };
    let mut stream = String::new();

    for fragment in &line.fragments {
        let chars = fragment.text.chars().count() as f32;
        let fragment_spaces = fragment.text.chars().filter(|ch| ch.is_whitespace()).count() as f32;
        let width = chars * char_width + fragment_spaces * extra_space;
        if let Some(background) = fragment.style.background {
            let (r, g, b) = pdf_color(background);
            stream.push_str(&format!(
                "q {r:.3} {g:.3} {b:.3} rg {x:.2} {:.2} {width:.2} {:.2} re f Q\n",
                y - 2.0,
                font_size + 3.0
            ));
        }
        let (r, g, b) = fragment
            .style
            .foreground
            .map(pdf_color)
            .unwrap_or((0.08, 0.08, 0.08));
        let font = pdf_font_name(fragment.style);
        stream.push_str(&format!(
            "BT /{font} {font_size:.1} Tf {r:.3} {g:.3} {b:.3} rg {extra_space:.3} Tw 1 0 0 1 {x:.2} {y:.2} Tm ({}) Tj ET\n",
            pdf_escape_text(&fragment.text)
        ));
        if fragment.style.underline {
            stream.push_str(&format!(
                "q {r:.3} {g:.3} {b:.3} RG 0.7 w {x:.2} {:.2} m {:.2} {:.2} l S Q\n",
                y - 1.5,
                x + width,
                y - 1.5
            ));
        }
        if fragment.style.strikethrough {
            stream.push_str(&format!(
                "q {r:.3} {g:.3} {b:.3} RG 0.7 w {x:.2} {:.2} m {:.2} {:.2} l S Q\n",
                y + font_size * 0.34,
                x + width,
                y + font_size * 0.34
            ));
        }
        x += width;
    }
    stream
}

fn write_pdf(target: &Path, documents: &[ExportDocument]) -> Result<()> {
    let page = documents
        .first()
        .map(|document| document.page)
        .unwrap_or_default();
    let (page_width, page_height) = page.pdf_page_points();
    let (margin_top, margin_right, margin_bottom, margin_left) = page.pdf_margins_points();
    let content_width = (page_width - margin_left - margin_right).max(120.0);
    let content_height = (page_height - margin_top - margin_bottom).max(120.0);
    let font_size = 11.0f32;
    let line_height = 14.0f32;
    let wrap_columns = ((content_width / (font_size * 0.60)).floor() as usize).max(20);
    let lines_per_page = ((content_height / line_height).floor() as usize).max(8);

    let bold = TextStyle { bold: true, ..TextStyle::default() };
    let mut lines = Vec::<PdfVisualLine>::new();
    for (document_index, document) in documents.iter().enumerate() {
        if document_index > 0 {
            lines.push(PdfVisualLine { fragments: Vec::new(), alignment: ParagraphAlignment::Left, justify: false });
        }
        lines.push(PdfVisualLine {
            fragments: vec![PdfFragment { text: document.title.clone(), style: bold }],
            alignment: ParagraphAlignment::Left,
            justify: false,
        });
        lines.push(PdfVisualLine { fragments: Vec::new(), alignment: ParagraphAlignment::Left, justify: false });

        for (line_index, line) in document.body.lines().enumerate() {
            let alignment = document.alignments.get(line_index).copied().unwrap_or_default();
            lines.extend(wrap_pdf_rich_line(line, wrap_columns, alignment));
        }
    }

    let pages = lines
        .chunks(lines_per_page)
        .map(Vec::from)
        .collect::<Vec<_>>();
    let pages = if pages.is_empty() { vec![Vec::new()] } else { pages };

    let page_count = pages.len();
    const FONT_COUNT: usize = 4;
    let first_page_object = 3 + FONT_COUNT;
    let first_content_object = first_page_object + page_count;
    let mut objects = Vec::<Vec<u8>>::new();

    objects.push(b"<< /Type /Catalog /Pages 2 0 R >>".to_vec());
    let kids = (0..page_count)
        .map(|index| format!("{} 0 R", first_page_object + index))
        .collect::<Vec<_>>()
        .join(" ");
    objects.push(format!("<< /Type /Pages /Count {page_count} /Kids [ {kids} ] >>").into_bytes());
    for base_font in ["Courier", "Courier-Bold", "Courier-Oblique", "Courier-BoldOblique"] {
        objects.push(format!(
            "<< /Type /Font /Subtype /Type1 /BaseFont /{base_font} /Encoding /WinAnsiEncoding >>"
        ).into_bytes());
    }

    for index in 0..page_count {
        objects.push(
            format!(
                "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 {page_width:.2} {page_height:.2}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents {} 0 R >>",
                first_content_object + index
            )
            .into_bytes(),
        );
    }

    let start_y = page_height - margin_top - font_size;
    for page_lines in &pages {
        let mut stream = String::new();
        for (index, line) in page_lines.iter().enumerate() {
            let y = start_y - index as f32 * line_height;
            stream.push_str(&pdf_line_stream(line, y, margin_left, content_width, font_size));
        }
        objects.push(
            format!(
                "<< /Length {} >>\nstream\n{}endstream",
                stream.len(),
                stream
            )
            .into_bytes(),
        );
    }

    let mut pdf = b"%PDF-1.4\n%\xE2\xE3\xCF\xD3\n".to_vec();
    let mut offsets = Vec::with_capacity(objects.len());
    for (index, object) in objects.iter().enumerate() {
        offsets.push(pdf.len());
        pdf.extend_from_slice(format!("{} 0 obj\n", index + 1).as_bytes());
        pdf.extend_from_slice(object);
        pdf.extend_from_slice(b"\nendobj\n");
    }
    let xref = pdf.len();
    pdf.extend_from_slice(format!("xref\n0 {}\n", objects.len() + 1).as_bytes());
    pdf.extend_from_slice(b"0000000000 65535 f \n");
    for offset in offsets {
        pdf.extend_from_slice(format!("{offset:010} 00000 n \n").as_bytes());
    }
    pdf.extend_from_slice(
        format!(
            "trailer\n<< /Size {} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n",
            objects.len() + 1
        )
        .as_bytes(),
    );
    fs::write(target, pdf).with_context(|| format!("No se pudo escribir {}", target.display()))
}
'''
