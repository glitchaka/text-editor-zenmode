name: Final functional cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/final-functional-cleanup.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clean launcher and obsolete code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/app.rs')
          s=p.read_text(encoding='utf-8')

          old='''            Ok(read_dir) => read_dir\n                .flatten()\n                .map(|entry| {\n                    let path = entry.path();'''
          new='''            Ok(read_dir) => read_dir\n                .flatten()\n                .filter(|entry| {\n                    let name = entry.file_name();\n                    let name = name.to_string_lossy();\n                    !name.to_ascii_lowercase().ends_with(".zen.json")\n                })\n                .map(|entry| {\n                    let path = entry.path();'''
          if old in s:
              s=s.replace(old,new,1)

          s=re.sub(r'\n    fn apply_format\(&mut self, action: &str, value: &str\) \{.*?\n    \}\n\n\n    fn insert_symbol', '\n\n    fn insert_symbol', s, count=1, flags=re.S)
          s=s.replace('Selecciona un documento .hsst para asignar proyecto.', 'Selecciona un documento TXT o HSST para asignar proyecto.')
          s=s.replace('No se pudo sincronizar HSST:', 'No se pudo sincronizar el documento:')
          s=s.replace('No se pudo preparar el tema HSST:', 'No se pudo preparar el tema de Zen Editor:')
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('src/spell.rs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const SOURCE: &str = "Helix-SST ortografía";', 'const SOURCE: &str = "Zen Editor ortografía";')
          s=s.replace('"name": "helix-sst-spell"', '"name": "zen-editor-spell"')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          cargo fmt --all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "fix: hide sidecars and remove obsolete formatting path"
          git pull --rebase origin main
          git push origin HEAD:main
