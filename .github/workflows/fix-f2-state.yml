name: Fix F2 state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply F2 state fix
        run: python .github/fix_f2_state.py
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix_f2_state.py .github/workflows/fix-f2-state.yml
          git add -A
          git commit -m "fix: make F2 menu close deterministic [skip ci]"
          git push origin HEAD:main
