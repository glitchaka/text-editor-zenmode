name: Fix editor input and wrap
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-editor-input-wrap.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply editor configuration fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/editor.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('mouse = false', 'mouse = true', 1)
          marker = 'end-of-line-diagnostics = "disable"\n\n[editor.inline-diagnostics]'
          replacement = 'end-of-line-diagnostics = "disable"\n\n[editor.soft-wrap]\nenable = true\nwrap-at-text-width = false\nmax-wrap = 25\nmax-indent-retain = 0\nwrap-indicator = ""\n\n[editor.inline-diagnostics]'
          if '[editor.soft-wrap]' not in s:
              if marker not in s:
                  raise SystemExit('editor config marker not found')
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: enable mouse selection and non-destructive soft wrap"
          git pull --rebase origin main
          git push origin HEAD:main
