        self.pomodoro_phase == PomodoroPhase::Rest
    }

    fn pomodoro_label(&self) -> String {
        let Some(deadline) = self.pomodoro_deadline else {
            return "POMODORO".into();
        };
        let remaining = deadline.saturating_duration_since(Instant::now()).as_secs();
        let minutes = remaining / 60;
        let seconds = remaining % 60;
        match self.pomodoro_phase {
            PomodoroPhase::Writing => format!("ESCRIBE {minutes:02}:{seconds:02}"),
            PomodoroPhase::Rest => format!("DESCANSO {minutes:02}:{seconds:02}"),
            PomodoroPhase::Idle => "POMODORO".into(),
        }
    }

    fn set_editor_theme(&self, theme: &str) {
        if let Some(editor) = self.editor.as_ref() {
            let _ = editor.send_command(&format!(":theme {theme}"));
        }
    }

    fn toggle_pomodoro(&mut self) {
        if self.editor.is_none() || self.pomodoro_resting() {
            return;
        }
        match self.pomodoro_phase {
            PomodoroPhase::Idle => {
                self.pomodoro_phase = PomodoroPhase::Writing;
                self.pomodoro_deadline = Some(Instant::now() + POMODORO_WRITE);
                self.set_editor_theme("helix-sst-zen");
            }
            PomodoroPhase::Writing => {
                self.pomodoro_phase = PomodoroPhase::Idle;
                self.pomodoro_deadline = None;
                self.set_editor_theme("helix-sst-zen");
            }
            PomodoroPhase::Rest => {}
        }
        self.dirty = true;
    }

    fn tick_pomodoro(&mut self) {
        let Some(deadline) = self.pomodoro_deadline else {
            return;
        };
        if Instant::now() < deadline {
            return;
        }
        match self.pomodoro_phase {
            PomodoroPhase::Writing => {
                self.pomodoro_phase = PomodoroPhase::Rest;
                self.pomodoro_deadline = Some(Instant::now() + POMODORO_REST);
                if let Some(editor) = self.editor.as_ref() {
                    let _ = editor.send_key(
                        KeyEvent::new(KeyCode::Esc, KeyModifiers::NONE),
                        editor.win32_input(),
                    );
                }
                self.set_editor_theme("helix-sst-rest");
            }
            PomodoroPhase::Rest => {
                self.pomodoro_phase = PomodoroPhase::Writing;
                self.pomodoro_deadline = Some(Instant::now() + POMODORO_WRITE);
                self.set_editor_theme("helix-sst-zen");
            }
            PomodoroPhase::Idle => {
                self.pomodoro_deadline = None;
            }
        }
        self.glyphs.clear();
        self.dirty = true;
    }

