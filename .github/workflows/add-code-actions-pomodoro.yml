    fn apply_format_command(&self, arguments: &Value) -> Result<bool> {
        let Some(source) = self.source_file.as_ref() else {
            return Ok(false);
        };
        let Some(args) = arguments.as_array() else {
            return Ok(false);
        };
        let action = args.first().and_then(Value::as_str).unwrap_or("");
        let value = args.get(1).and_then(Value::as_str).unwrap_or("");
        let Some(range) = args.get(2) else {
            return Ok(false);
        };
        let read_pos = |side: &str| -> Option<(usize, usize)> {
            let line = range.pointer(&format!("/{side}/line"))?.as_u64()? as usize;
            let character = range.pointer(&format!("/{side}/character"))?.as_u64()? as usize;
            Some((line, character))
        };
        let Some((start_line, start_character)) = read_pos("start") else {
            return Ok(false);
        };
        let Some((end_line, end_character)) = read_pos("end") else {
            return Ok(false);
        };
        crate::document::apply_format_lsp_range(
            source,
            start_line,
            start_character,
            end_line,
            end_character,
            action,
            value,
        )
    }

