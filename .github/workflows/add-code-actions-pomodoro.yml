name: Add HSST actions and Pomodoro

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-code-actions-pomodoro.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply changes
        run: python .github/scripts/add_code_actions_pomodoro.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/add-code-actions-pomodoro.yml
          rm .github/scripts/add_code_actions_pomodoro.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agregar acciones HSST y Pomodoro [skip ci]"
          git push origin HEAD:main
