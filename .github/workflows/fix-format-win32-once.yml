name: Fix format Win32 once

on:
  push:
    branches:
      - fix-format-win32

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Patch Win32 synthetic text input
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/editor.rs')
          s = p.read_text(encoding='utf-8')
          old = '''        KeyCode::Char(ch) => {
            let vk = if ch.is_ascii_alphanumeric() {
                ch.to_ascii_uppercase() as u16
            } else {
                0
            };
            let character = if key.modifiers.contains(KeyModifiers::CONTROL) {
                match ch.to_ascii_lowercase() {
                    'a'..='z' => char::from((ch.to_ascii_lowercase() as u8) & 0x1f),
                    ' ' | '@' | '2' => '\\0',
                    '[' => '\\x1b',
                    '\\\\' => '\\x1c',
                    ']' => '\\x1d',
                    '^' => '\\x1e',
                    '_' => '\\x1f',
                    '?' => '\\x7f',
                    _ => ch,
                }
            } else {
                ch
            };
            (vk, character.to_string())
        }'''
          new = '''        KeyCode::Char(ch) => {
            #[cfg(windows)]
            let vk = {
                use windows_sys::Win32::UI::Input::KeyboardAndMouse::VkKeyScanW;

                let mapped = if (ch as u32) <= u16::MAX as u32 {
                    unsafe { VkKeyScanW(ch as u16) }
                } else {
                    -1
                };
                if mapped != -1 {
                    let mapped = mapped as u16;
                    let required = (mapped >> 8) & 0x00ff;
                    if required & 0x01 != 0 {
                        state |= 0x10;
                    }
                    if required & 0x02 != 0 {
                        state |= 0x08;
                    }
                    if required & 0x04 != 0 {
                        state |= 0x02;
                    }
                    mapped & 0x00ff
                } else if ch.is_ascii_alphanumeric() {
                    ch.to_ascii_uppercase() as u16
                } else {
                    0
                }
            };
            #[cfg(not(windows))]
            let vk = if ch.is_ascii_alphanumeric() {
                ch.to_ascii_uppercase() as u16
            } else {
                0
            };

            let character = if key.modifiers.contains(KeyModifiers::CONTROL) {
                match ch.to_ascii_lowercase() {
                    'a'..='z' => char::from((ch.to_ascii_lowercase() as u8) & 0x1f),
                    ' ' | '@' | '2' => '\\0',
                    '[' => '\\x1b',
                    '\\\\' => '\\x1c',
                    ']' => '\\x1d',
                    '^' => '\\x1e',
                    '_' => '\\x1f',
                    '?' => '\\x7f',
                    _ => ch,
                }
            } else {
                ch
            };
            (vk, character.to_string())
        }'''
          if old not in s:
              raise SystemExit('KeyCode::Char Win32 block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('Cargo.toml')
          s = p.read_text(encoding='utf-8')
          if 'version = "0.2.7"' not in s:
              raise SystemExit('version 0.2.7 not found')
          p.write_text(s.replace('version = "0.2.7"', 'version = "0.2.8"', 1), encoding='utf-8')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/fix-format-win32-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor.rs Cargo.toml .github/workflows/fix-format-win32-once.yml
          git commit -m "Corregir comandos Win32 completos para formato [skip ci]"
          git push origin HEAD:fix-format-win32
