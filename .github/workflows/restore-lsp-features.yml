name: Restore LSP features
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-lsp-features.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire existing LSP features
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/spell.rs')
          s=p.read_text()
          s=s.replace('''                                "textDocumentSync": 1,\n                                "codeActionProvider": true,''','''                                "textDocumentSync": 1,\n                                "completionProvider": {},\n                                "semanticTokensProvider": {\n                                    "legend": {\n                                        "tokenTypes": crate::format::SEMANTIC_TOKEN_TYPES,\n                                        "tokenModifiers": []\n                                    },\n                                    "full": true\n                                },\n                                "codeActionProvider": true,''',1)
          marker='''            "textDocument/codeAction" => {\n'''
          if '"textDocument/completion" =>' not in s:
              s=s.replace(marker,'''            "textDocument/completion" => {\n                if let Some(id) = id {\n                    let items = server.completions(message.get("params").unwrap_or(&Value::Null));\n                    send_response(&mut output, id, Value::Array(items))?;\n                }\n            }\n            "textDocument/semanticTokens/full" => {\n                if let Some(id) = id {\n                    let data = server.semantic_tokens(message.get("params").unwrap_or(&Value::Null));\n                    send_response(&mut output, id, json!({ "data": data }))?;\n                }\n            }\n'''+marker,1)
          p.write_text(s)
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          cargo update -w
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spell.rs Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "fix: activate completion and semantic token LSP paths"
          git pull --rebase origin main
          git push origin HEAD:main
