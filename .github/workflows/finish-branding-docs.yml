name: Finish Zen Editor branding and docs
on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-branding-docs.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update branding and current feature documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/app.rs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('██  HELIX SST  ██', '██  ZEN EDITOR  ██')
          s=s.replace('TERMINAL EDITOR SYSTEM · v{APP_VERSION}', 'ZEN EDITOR SYSTEM · v{APP_VERSION}')
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('README.md')
          r=p.read_text(encoding='utf-8')
          r=r.replace('# Helix-SST Zenmode', '# Zen Editor', 1)
          r=re.sub(
              r'\*\*Helix-SST Zenmode\*\* es un editor de escritura para Windows construido alrededor de \*\*Helix 25\.07\.1\*\*\..*?formato enriquecido, documentos `\.hsst`, corrección ortográfica en español de Chile, geometría de página, proyectos y exportación\.',
              '**Zen Editor** es un editor de escritura para Windows construido sobre **Helix 25.07.1**. Mantiene Helix como motor real de edición dentro de una PTY y añade una interfaz Rust/Slint orientada a escritura larga, formato enriquecido no destructivo, documentos `.hsst`, corrección ortográfica en español de Chile, proyectos, importación y exportación.',
              r,
              count=1,
              flags=re.S,
          )
          r=r.replace('Helix-SST combina dos usos:', 'Zen Editor combina dos usos:')
          r=r.replace('Helix-SST UI + launcher + perfiles de página', 'Zen Editor UI + launcher + perfiles de página')
          r=r.replace('El corrector ortográfico\n\nHelix-SST incluye', 'El corrector ortográfico\n\nZen Editor incluye')
          r=r.replace('corrector de Helix-SST', 'corrector de Zen Editor')
          r=r.replace('Helix-SST recibe la ruta', 'Zen Editor recibe la ruta')
          r=r.replace('Helix-SST puede ordenar capítulos', 'Zen Editor puede ordenar capítulos')
          r=r.replace('helix-sst-zen.exe', 'zen-editor.exe')
          r=r.replace('helix-sst-zen "', 'zen-editor "')
          r=r.replace('helix-sst-zen --zen', 'zen-editor --zen')

          # Formatting section: F2 only, no toolbar fiction.
          r=re.sub(
              r'## Formato enriquecido\n.*?## Página, márgenes y salto de línea',
              '''## Formato enriquecido\n\nEl formato enriquecido se aplica **solo desde `F2`** sobre una selección. No existe una segunda barra B/I/U ni controles de formato en la isla inferior.\n\nLas acciones disponibles incluyen:\n\n- negrita, cursiva, subrayado y tachado;\n- color de texto;\n- color de destacador/fondo;\n- alineación de párrafo: izquierda, centrada, derecha y justificada.\n\nEl formato se guarda en `formatting.json` y nunca se inserta como marcas dentro de `content.txt`.\n\nLa isla inferior se mantiene deliberadamente compacta: **Pomodoro · Ω símbolos · cerrar**.\n\n## Página, márgenes y salto de línea''',
              r,
              count=1,
              flags=re.S,
          )

          # Current wrap model is soft/non-destructive.
          r=re.sub(
              r'El ancho útil de escritura se calcula a partir de:.*?Los demás tamaños, orientaciones y márgenes ajustan ese valor proporcionalmente\.',
              '''La presentación usa **soft-wrap no destructivo**: una línea larga se adapta al ancho visible sin insertar saltos físicos en `content.txt`. Un párrafo continúa siendo un párrafo aunque ocupe varias filas visuales. Los saltos que sí escribe el autor se conservan literalmente.''',
              r,
              count=1,
              flags=re.S,
          )
          r=r.replace('Las líneas largas se refluyean al ancho útil definido por el perfil de página.', 'Las líneas largas se muestran mediante soft-wrap; el pegado no reescribe el texto para ajustarlo al ancho de la ventana.')

          # Add import section before export if absent.
          if '## Importación' not in r:
              r=r.replace(
                  '## Exportación\n',
                  '''## Importación\n\nDesde el launcher, `I` importa a `.hsst`:\n\n- TXT y texto plano;\n- Markdown;\n- DOCX.\n\nLa importación DOCX conserva texto y, cuando están presentes, negrita, cursiva, subrayado, tachado, color, resaltado y alineación de párrafo.\n\n## Exportación\n''',
                  1,
              )

          r=r.replace('DOCX y PDF usan el tamaño de papel, orientación y márgenes guardados en el documento.', 'DOCX y PDF usan el tamaño de papel, orientación y márgenes guardados en el documento. Ambos reconstruyen el formato enriquecido; DOCX y PDF conservan también la alineación de párrafo.')
          r=r.replace('| `F2` | corrección ortográfica |', '| `F2` | corrección ortográfica y formato de la selección |')
          r=r.replace('| `E` | exportar |', '| `I` | importar TXT, Markdown o DOCX |\n| `E` | exportar |')
          r=r.replace('Actualmente puede representar:\n\n- negrita;\n- cursiva;\n- subrayado;\n- color de texto;\n- color de destacador/fondo.', 'Actualmente puede representar:\n\n- negrita;\n- cursiva;\n- subrayado;\n- tachado;\n- color de texto;\n- color de destacador/fondo;\n- alineación de párrafo.')
          r=re.sub(r'Versión actual: \*\*[^*]+\*\*\.', 'Versión actual: la indicada por `Cargo.toml`.', r, count=1)
          p.write_text(r,encoding='utf-8',newline='\n')
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: align Zen Editor branding and current behavior"
          git pull --rebase origin main
          git push origin HEAD:main
