name: Restore editor area once

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore full editor viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app.rs")
          text = path.read_text(encoding="utf-8")
          start_marker = "    fn page_visual(&self) -> Option<PageVisual> {\n"
          end_marker = "\n    fn geometry(&self) -> (f32, f32, f32, f32) {"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("No se encontró page_visual")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("No se encontró geometry después de page_visual")
          replacement = "    fn page_visual(&self) -> Option<PageVisual> {\n        None\n    }\n"
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-editor-area-once.yml
          git add src/app.rs
          git commit -m "Restaurar viewport completo del editor"
          git push
