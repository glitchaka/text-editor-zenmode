name: Fix island visibility once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-island-visibility-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Fix island state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app.rs')
          s = p.read_text(encoding='utf-8')

          old = '''        island := Rectangle {
            visible: root.zen-active
                ? (zen-reveal.has-hover
                    || zen-title-hover.has-hover
                    || zen-touch.has-hover
                    || root.font-palette-open
                    || root.highlight-palette-open
                    || root.symbols-open
                    || root.page-menu-open)
                : true;'''
          new = '''        island := Rectangle {
            // Fuera de Zenmode la isla debe permanecer visible siempre. En el
            // launcher editor-active es false, así que tampoco puede heredar
            // accidentalmente un zen-active obsoleto al cerrar el editor.
            visible: !root.editor-active
                || !root.zen-active
                || zen-reveal.has-hover
                || zen-title-hover.has-hover
                || zen-touch.has-hover
                || root.font-palette-open
                || root.highlight-palette-open
                || root.symbols-open
                || root.page-menu-open;'''
          if old not in s:
              raise SystemExit('island visibility block not found')
          s = s.replace(old, new, 1)

          old = '''        if finished {
            if let Some(editor) = self.editor.as_mut() {
                let _ = editor.flush_native();
            }
            self.editor = None;'''
          new = '''        if finished {
            if let Some(editor) = self.editor.as_mut() {
                let _ = editor.flush_native();
            }
            // Volver al launcher siempre implica salir del estado Zen real.
            self.zen_requested = false;
            self.editor = None;'''
          if old not in s:
              raise SystemExit('finished editor block not found')
          s = s.replace(old, new, 1)

          old = '''    {
        let model = model.clone();
        ui.on_key_input(move |text, ctrl, alt, shift| {
            handle_key(&mut model.borrow_mut(), text.as_str(), ctrl, alt, shift);
        });
    }
    {
        let model = model.clone();
        ui.on_toggle_zen(move || model.borrow_mut().toggle_editor_zen());
    }'''
          new = '''    {
        let model = model.clone();
        let weak = ui.as_weak();
        ui.on_key_input(move |text, ctrl, alt, shift| {
            {
                let mut model = model.borrow_mut();
                handle_key(&mut model, text.as_str(), ctrl, alt, shift);
            }
            // No esperar al timer para reflejar la salida de Zenmode: la isla
            // vuelve a mostrarse en el mismo evento de teclado.
            if let Some(ui) = weak.upgrade() {
                let model = model.borrow();
                ui.set_zen_active(model.zen_engaged());
                ui.set_editor_active(model.editor.is_some());
            }
        });
    }
    {
        let model = model.clone();
        let weak = ui.as_weak();
        ui.on_toggle_zen(move || {
            let zen = {
                let mut model = model.borrow_mut();
                model.toggle_editor_zen();
                model.zen_engaged()
            };
            if let Some(ui) = weak.upgrade() {
                ui.set_zen_active(zen);
            }
        });
    }'''
          if old not in s:
              raise SystemExit('ui zen callback block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('Cargo.toml')
          s = p.read_text(encoding='utf-8')
          if 'version = "0.2.8"' not in s:
              raise SystemExit('version 0.2.8 not found')
          p.write_text(s.replace('version = "0.2.8"', 'version = "0.2.9"', 1), encoding='utf-8')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Commit fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/fix-island-visibility-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs Cargo.toml .github/workflows/fix-island-visibility-once.yml
          git commit -m "Mantener isla visible al salir de Zenmode [skip ci]"
          git push origin HEAD:main
