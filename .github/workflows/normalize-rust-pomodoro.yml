name: Normalize Rust Pomodoro Workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-rust-pomodoro.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize source line endings before patching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-rust-pomodoro.yml')
          s = p.read_text(encoding='utf-8')
          needle = "          # document.rs: aplicar formato directamente por rango LSP sobre formatting.json\n"
          insert = """          foreach ($sourcePath in @('src/document.rs', 'src/spell.rs', 'src/editor.rs', 'src/app.rs', 'Cargo.toml')) {\n            $sourceText = Get-Content -Raw $sourcePath\n            $sourceText = $sourceText.Replace(\"`r`n\", \"`n\")\n            Write-Utf8 $sourcePath $sourceText\n          }\n\n"""
          if needle not in s:
              raise SystemExit('patch marker not found')
          if insert not in s:
              s = s.replace(needle, insert + needle, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/normalize-rust-pomodoro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalizar fuentes antes de aplicar Pomodoro"
          git push origin HEAD:main
