name: Sync release notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          matches = list(re.finditer(r'^## (v\d+\.\d+\.\d+) — ([^\n]+)\n', text, re.M))
          for i, m in enumerate(matches):
              tag = m.group(1)
              start = m.end()
              end = matches[i+1].start() if i + 1 < len(matches) else len(text)
              bullets = [line for line in text[start:end].splitlines() if line.startswith('- ')]
              if not bullets:
                  continue
              body = f'## Zen Editor {tag}\n\n' + '\n'.join(bullets) + '\n'
              check = subprocess.run(['gh','release','view',tag,'--repo',__import__('os').environ['REPO']], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if check.returncode == 0:
                  subprocess.run(['gh','release','edit',tag,'--repo',__import__('os').environ['REPO'],'--notes',body], check=True)
          PY
