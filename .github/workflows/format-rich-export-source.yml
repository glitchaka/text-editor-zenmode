name: Normalize rich export source
on:
  push:
    branches: [main]
    paths: [.github/workflows/format-rich-export-source.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove stale import and format source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/export.rs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('format::{ParagraphAlignment, StyledRun, TextStyle}', 'format::{ParagraphAlignment, TextStyle}')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          cargo fmt --all
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/export.rs src/document.rs src/app.rs src/spell.rs src/format.rs src/editor.rs
          git diff --cached --quiet && exit 0
          git commit -m "chore: normalize finished editor source"
          git pull --rebase origin main
          git push origin HEAD:main
