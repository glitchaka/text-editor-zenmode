name: Fix visible HSST formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-visible-format-render.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer
        shell: bash
        run: echo '' | base64 -d | python3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit patch
        shell: bash
        run: |
          git config user.name glitchaka
          git config user.email 82622846+glitchaka@users.noreply.github.com
          git add src/app.rs
          git commit -m 'fix: render HSST formatting visibly over Helix terminal'
          git push origin HEAD:main
