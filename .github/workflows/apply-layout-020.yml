name: Apply 0.2.20 layout repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply dock maximize and word count
        run: python3 .github/fix_layout_wordcount.py
      - name: Apply version metadata
        run: python3 .github/fix_version.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit 0.2.20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix_layout_wordcount.py .github/fix_version.py .github/workflows/apply-layout-020.yml
          git add src/app.rs Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "feat: compact persistent dock, word count and taskbar-safe zen 0.2.20 [skip ci]"
          git push origin HEAD:main
