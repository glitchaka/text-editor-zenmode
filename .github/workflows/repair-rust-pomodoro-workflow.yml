name: Repair Rust Pomodoro Workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-rust-pomodoro-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair PowerShell file writes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-rust-pomodoro.yml')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Set-Content -Encoding UTF8 -NoNewline $Path $s': '[System.IO.File]::WriteAllText($Path, $s, [System.Text.UTF8Encoding]::new($false))',
              "Set-Content -Encoding UTF8 -NoNewline 'src/editor.rs' $e": "[System.IO.File]::WriteAllText('src/editor.rs', $e, [System.Text.UTF8Encoding]::new($false))",
              "Set-Content -Encoding UTF8 -NoNewline 'src/app.rs' $app": "[System.IO.File]::WriteAllText('src/app.rs', $app, [System.Text.UTF8Encoding]::new($false))",
              "Set-Content -Encoding UTF8 -NoNewline 'Cargo.toml' $cargo": "[System.IO.File]::WriteAllText('Cargo.toml', $cargo, [System.Text.UTF8Encoding]::new($false))",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/repair-rust-pomodoro-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregir workflow Rust de Pomodoro [skip ci]"
          git push origin HEAD:main
