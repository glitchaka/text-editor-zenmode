name: Repair UI and formatting final

on:
  push:
    branches:
      - repair-ui-format-final
    paths:
      - .github/workflows/repair-ui-format-final.yml

permissions:
  contents: write

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-Lf([string]$Path) {
            (Get-Content -Raw $Path).Replace("`r`n", "`n")
          }
          function Write-Utf8([string]$Path, [string]$Text) {
            [System.IO.File]::WriteAllText($Path, $Text, [System.Text.UTF8Encoding]::new($false))
          }
          function Replace-Once([string]$Text, [string]$Old, [string]$New, [string]$Label) {
            $index = $Text.IndexOf($Old)
            if ($index -lt 0) { throw "No se encontró bloque: $Label" }
            $Text.Substring(0, $index) + $New + $Text.Substring($index + $Old.Length)
          }

          $app = Read-Lf 'src/app.rs'
          $editor = Read-Lf 'src/editor.rs'
          $spell = Read-Lf 'src/spell.rs'
          $cargo = Read-Lf 'Cargo.toml'

          # 1) Barra/isla inferior: visible en launcher y editor, con zona real de arrastre
          #    y únicamente Pomodoro, símbolos y apagar como controles.
          if (-not $app.Contains('in property <bool> pomodoro-requested: false;')) {
            $app = $app.Replace(
              '        in property <bool> pomodoro-break: false;`n',
              '        in property <bool> pomodoro-break: false;`n        in property <bool> pomodoro-requested: false;`n'
            )
          }

          $start = $app.IndexOf('        bottom-reveal := TouchArea {')
          $end = $app.IndexOf('        font-palette := Rectangle {', $start)
          if ($start -lt 0 -or $end -lt 0) { throw 'No se encontró la isla inferior actual' }

          $island = @'
        bottom-reveal := TouchArea {
            x: root.width - 284px;
            y: root.height - 12px;
            width: 284px;
            height: 12px;
            enabled: root.zen-active;
        }

        island := Rectangle {
            visible: !root.zen-active
                || bottom-reveal.has-hover
                || island-hover.has-hover
                || root.symbols-open
                || root.pomodoro-text != "";
            width: 270px;
            height: 36px;
            x: root.width - self.width - 14px;
            y: root.height - self.height - 7px;
            border-radius: 13px;
            background: rgba(10, 13, 20, 0.97);
            border-width: 1px;
            border-color: #354052;

            island-hover := TouchArea {
                x: 0; y: 0; width: parent.width; height: parent.height;
            }

            // Zona dedicada para mover la ventana. No pisa los tres controles.
            Rectangle {
                x: 4px; y: 3px; width: 54px; height: 30px;
                border-radius: 9px;
                background: move-hover.has-hover ? #172334 : transparent;
                Text {
                    width: 100%; height: 100%; text: "⋮⋮"; color: #5f6d7c;
                    font-family: "Segoe UI Variable"; font-size: 14px;
                    horizontal-alignment: center; vertical-alignment: center;
                }
                move-hover := TouchArea {
                    x: 0; y: 0; width: parent.width; height: parent.height;
                    enabled: !root.zen-active;
                }
                WindowMoveArea {
                    x: 0; y: 0; width: parent.width; height: parent.height;
                    enabled: !root.zen-active;
                }
            }

            Rectangle {
                x: 62px; y: 3px; width: 126px; height: 30px;
                border-radius: 9px;
                background: pomodoro-touch.pressed
                    ? #29384b
                    : pomodoro-touch.has-hover ? #172334 : transparent;
                Text {
                    width: 100%; height: 100%;
                    text: root.pomodoro-text != ""
                        ? root.pomodoro-text
                        : (root.pomodoro-requested ? "POMODORO ✓" : "POMODORO");
                    color: root.pomodoro-break ? #ffb4a2 : (root.pomodoro-requested ? #b8bb26 : #e8cc83);
                    font-family: "Segoe UI Variable";
                    font-size: root.pomodoro-text != "" ? 10px : 11px;
                    font-weight: 650;
                    horizontal-alignment: center;
                    vertical-alignment: center;
                }
                pomodoro-touch := TouchArea {
                    mouse-cursor: pointer;
                    clicked => { root.start-pomodoro(); terminal-focus.focus(); }
                }
            }

            Rectangle {
                x: 192px; y: 3px; width: 34px; height: 30px;
                border-radius: 9px;
                background: symbol-menu.pressed
                    ? #29384b
                    : symbol-menu.has-hover ? #172334 : transparent;
                opacity: root.editor-active ? 1 : 0.38;
                Text {
                    width: 100%; height: 100%; text: "Ω"; color: #8db9bb;
                    font-family: "Segoe UI Variable"; font-size: 16px;
                    horizontal-alignment: center; vertical-alignment: center;
                }
                symbol-menu := TouchArea {
                    enabled: root.editor-active;
                    mouse-cursor: pointer;
                    clicked => {
                        root.symbols-open = !root.symbols-open;
                        root.font-palette-open = false;
                        root.highlight-palette-open = false;
                        root.page-menu-open = false;
                    }
                }
            }

            Rectangle {
                x: 230px; y: 2px; width: 38px; height: 32px;
                border-radius: 10px;
                background: close-touch.pressed
                    ? rgb(62, 23, 36)
                    : close-touch.has-hover ? rgb(48, 18, 28) : transparent;
                Path {
                    x: 10px; y: 8px; width: 18px; height: 18px;
                    commands: "M 9 1 L 9 8 M 3.3 3.7 A 7 7 0 1 0 14.7 3.7";
                    stroke: close-touch.has-hover ? #ff5d78 : #ff9fbd;
                    stroke-width: 2px; stroke-line-cap: round;
                }
                close-touch := TouchArea {
                    mouse-cursor: pointer;
                    clicked => { root.close-window(); }
                }
            }
        }

'@
          $app = $app.Substring(0, $start) + $island + $app.Substring($end)

          # La paleta de símbolos debe abrir hacia arriba desde la isla inferior.
          $app = $app.Replace(
            '            x: island.x + island.width - self.width;`n            y: island.y - self.height - 5px;',
            '            x: island.x + island.width - self.width;`n            y: island.y - self.height - 5px;'
          )

          # 2) Pomodoro desde el launcher: el botón deja armada la sesión y al abrir/crear
          #    comienza de inmediato. Si se pulsa de nuevo en launcher, se desarma.
          $oldStart = @'
    fn start_pomodoro(&mut self) {
        if self.editor.is_none() || self.pomodoro_active {
            self.pomodoro_offer = false;
            return;
        }
        self.pomodoro_offer = false;
        self.pomodoro_active = true;
        self.pomodoro_break = false;
        self.pomodoro_deadline = Some(Instant::now() + Duration::from_secs(POMODORO_WRITE_SECS));
        if let Some(editor) = self.editor.as_ref() {
            let _ = editor.send_command(":theme helix-sst-zen");
        }
        self.dirty = true;
    }
'@
          $newStart = @'
    fn start_pomodoro(&mut self) {
        if self.editor.is_none() {
            self.pomodoro_requested = !self.pomodoro_requested;
            self.pomodoro_offer = false;
            self.dirty = true;
            self.render_launcher();
            return;
        }
        if self.pomodoro_active {
            return;
        }
        self.pomodoro_offer = false;
        self.pomodoro_requested = true;
        self.pomodoro_active = true;
        self.pomodoro_break = false;
        self.pomodoro_deadline = Some(Instant::now() + Duration::from_secs(POMODORO_WRITE_SECS));
        if let Some(editor) = self.editor.as_ref() {
            let _ = editor.send_command(":theme helix-sst-zen");
        }
        self.dirty = true;
    }
'@
          $app = Replace-Once $app $oldStart $newStart 'start_pomodoro'

          # Sincronizar el estado de Pomodoro con la UI en todos los refrescos existentes.
          if (-not $app.Contains('ui.set_pomodoro_requested(model.pomodoro_requested);')) {
            $app = $app.Replace(
              '                ui.set_pomodoro_break(model.pomodoro_break);',
              '                ui.set_pomodoro_requested(model.pomodoro_requested);`n                ui.set_pomodoro_break(model.pomodoro_break);'
            )
            $app = $app.Replace(
              '        ui.set_pomodoro_break(model.pomodoro_break);',
              '        ui.set_pomodoro_requested(model.pomodoro_requested);`n        ui.set_pomodoro_break(model.pomodoro_break);'
            )
            $app = $app.Replace(
              '            ui.set_pomodoro_break(model.pomodoro_break);',
              '            ui.set_pomodoro_requested(model.pomodoro_requested);`n            ui.set_pomodoro_break(model.pomodoro_break);'
            )
          }

          # 3) El formato de escritor sólo intercepta Ctrl+B/I/U en .hsst; el resto sigue siendo Helix.
          $app = $app.Replace(
            '    if model.editor.is_some() && ctrl {',
            '    if model.editor.is_some()`n        && model.current_file.as_deref().is_some_and(document::is_native_path)`n        && ctrl`n    {'
          )

          # 4) Corregir el proveedor de portapapeles de Helix. Estaba al revés:
          #    yank debe ESCRIBIR al portapapeles y paste debe LEERLO.
          $oldClipboard = @'
[editor.clipboard-provider.custom]
yank = { command = "{exe}", args = ["--clipboard-get"] }
paste = { command = "{exe}", args = ["--clipboard-set"] }
'@
          $newClipboard = @'
[editor.clipboard-provider.custom]
yank = { command = "{exe}", args = ["--clipboard-set"] }
paste = { command = "{exe}", args = ["--clipboard-get"] }
'@
          $editor = Replace-Once $editor $oldClipboard $newClipboard 'clipboard Helix'

          # 5) Las acciones F2 aplican el formato y además fuerzan un didChange inocuo
          #    reemplazando la selección por sí misma; así Helix vuelve a pedir tokens semánticos.
          $oldClosure = @'
            let mut push_format = |title: &str, action: &str, value: &str| {
                actions.push(json!({
                    "title": title,
                    "kind": "refactor.rewrite",
                    "command": {
                        "title": title,
                        "command": FORMAT_COMMAND,
                        "arguments": [uri, range.clone(), action, value]
                    }
                }));
            };
'@
          $newClosure = @'
            let selected_text = self
                .documents
                .get(uri)
                .and_then(|text| selected_text_for_lsp_range(text, &range))
                .unwrap_or_default();
            let mut push_format = |title: &str, action: &str, value: &str| {
                let mut changes = Map::new();
                changes.insert(
                    uri.to_owned(),
                    json!([{
                        "range": range.clone(),
                        "newText": selected_text.clone()
                    }]),
                );
                actions.push(json!({
                    "title": title,
                    "kind": "refactor.rewrite",
                    "edit": { "changes": Value::Object(changes) },
                    "command": {
                        "title": title,
                        "command": FORMAT_COMMAND,
                        "arguments": [uri, range.clone(), action, value]
                    }
                }));
            };
'@
          $spell = Replace-Once $spell $oldClosure $newClosure 'acciones de formato F2'

          if (-not $spell.Contains('fn selected_text_for_lsp_range(')) {
            $helper = @'
fn selected_text_for_lsp_range(text: &str, range: &Value) -> Option<String> {
    fn utf16_to_byte(line: &str, character: usize) -> usize {
        let mut utf16 = 0usize;
        for (offset, ch) in line.char_indices() {
            if utf16 >= character {
                return offset;
            }
            let next = utf16 + ch.len_utf16();
            if next > character {
                return offset;
            }
            utf16 = next;
        }
        line.len()
    }

    let start_line = range.pointer("/start/line")?.as_u64()? as usize;
    let start_character = range.pointer("/start/character")?.as_u64()? as usize;
    let end_line = range.pointer("/end/line")?.as_u64()? as usize;
    let end_character = range.pointer("/end/character")?.as_u64()? as usize;

    let mut offsets = Vec::new();
    let mut absolute = 0usize;
    for segment in text.split_inclusive('\n') {
        let line = segment.strip_suffix('\n').unwrap_or(segment);
        offsets.push((absolute, line));
        absolute += segment.len();
    }
    if offsets.is_empty() {
        offsets.push((0, text));
    }
    let (start_base, start_text) = *offsets.get(start_line)?;
    let (end_base, end_text) = *offsets.get(end_line)?;
    let start = start_base + utf16_to_byte(start_text, start_character);
    let end = end_base + utf16_to_byte(end_text, end_character);
    if start >= end || end > text.len() || !text.is_char_boundary(start) || !text.is_char_boundary(end) {
        return None;
    }
    Some(text[start..end].to_owned())
}

'@
            $marker = 'fn word_prefix_at(text: &str, line: usize, utf16_character: usize) -> String {'
            $idx = $spell.IndexOf($marker)
            if ($idx -lt 0) { throw 'No se encontró punto para helper LSP' }
            $spell = $spell.Substring(0, $idx) + $helper + $spell.Substring($idx)
          }

          # 6) Solo .hsst usa hard-wrap de página; txt/md/código conserva Helix normal.
          $app = $app.Replace(
            '        document::is_supported_text_path(current).then(|| self.page_profile.text_columns())',
            '        document::is_native_path(current).then(|| self.page_profile.text_columns())'
          )

          $cargo = $cargo.Replace('version = "0.2.13"', 'version = "0.2.14"')

          Write-Utf8 'src/app.rs' $app
          Write-Utf8 'src/editor.rs' $editor
          Write-Utf8 'src/spell.rs' $spell
          Write-Utf8 'Cargo.toml' $cargo

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Clippy
        shell: pwsh
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        shell: pwsh
        run: cargo test --release

      - name: Build release
        shell: pwsh
        run: cargo build --release

      - name: Commit directly to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src/app.rs src/editor.rs src/spell.rs
          git commit -m "Restaurar barra inferior y cerrar formato HSST"
          git push origin HEAD:main
