name: Cleanup releases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Clean release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python .github/release_cleanup.py
      - name: Remove one-shot cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/release_cleanup.py .github/workflows/cleanup-releases.yml
          git commit -m "chore: remove release cleanup workflow [skip ci]"
          git push origin HEAD:main
