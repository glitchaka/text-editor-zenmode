name: Apply remaining window input CLI fixes

on:
  push:
    paths:
      - '.github/workflows/hotfix-window-controls-wrap-cli.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path

          def repl(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          p = Path('src/app.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '''            BringWindowToTop, GetForegroundWindow, GetWindowThreadProcessId, HWND_NOTOPMOST,\n            HWND_TOPMOST, SWP_NOACTIVATE, SWP_NOMOVE, SWP_NOSIZE, SetForegroundWindow,\n            SetWindowPos,''', '''            BringWindowToTop, GetForegroundWindow, GetWindowThreadProcessId, IsZoomed,\n            HWND_NOTOPMOST, HWND_TOPMOST, SW_MAXIMIZE, SW_MINIMIZE, SW_RESTORE, SWP_NOACTIVATE,\n            SWP_NOMOVE, SWP_NOSIZE, SetForegroundWindow, SetWindowPos, ShowWindow,''', 'win32 controls imports')
          s = repl(s, '''        callback toggle-zen();\n        callback close-window();\n        callback start-pomodoro();''', '''        callback toggle-zen();\n        callback minimize-window();\n        callback maximize-window();\n        callback close-window();\n        callback start-pomodoro();''', 'window callbacks')
          s = repl(s, '''            width: 196px;''', '''            width: 264px;''', 'main island width')
          s = repl(s, '''                x: 5px; y: 3px; width: 112px; height: 28px;''', '''                x: 5px; y: 3px; width: 100px; height: 28px;''', 'pomodoro width')
          s = repl(s, '''                x: 121px; y: 3px; width: 32px; height: 28px;''', '''                x: 109px; y: 3px; width: 32px; height: 28px;''', 'symbol position')
          close_block = '''            Rectangle {\n                x: 157px; y: 1px; width: 38px; height: 32px;\n                border-radius: 10px;\n                background: close-touch.pressed\n                    ? rgb(62, 23, 36)\n                    : close-touch.has-hover ? rgb(48, 18, 28) : transparent;\n                Path {\n                    x: 10px; y: 8px; width: 18px; height: 18px;\n                    commands: "M 9 1 L 9 8 M 3.3 3.7 A 7 7 0 1 0 14.7 3.7";\n                    stroke: close-touch.has-hover ? #ff5d78 : #ff9fbd;\n                    stroke-width: 2px; stroke-line-cap: round;\n                }\n                close-touch := TouchArea {\n                    mouse-cursor: pointer;\n                    clicked => { root.close-window(); }\n                }\n            }'''
          controls = '''            Rectangle {\n                x: 145px; y: 3px; width: 32px; height: 28px; border-radius: 9px;\n                background: min-touch.pressed ? #29384b : min-touch.has-hover ? #172334 : transparent;\n                Text { width: 100%; height: 100%; text: "—"; color: #9aa7b8; font-size: 14px; horizontal-alignment: center; vertical-alignment: center; }\n                min-touch := TouchArea { mouse-cursor: pointer; clicked => { root.minimize-window(); } }\n            }\n            Rectangle {\n                x: 181px; y: 3px; width: 32px; height: 28px; border-radius: 9px;\n                background: max-touch.pressed ? #29384b : max-touch.has-hover ? #172334 : transparent;\n                Text { width: 100%; height: 100%; text: "□"; color: #9aa7b8; font-size: 15px; horizontal-alignment: center; vertical-alignment: center; }\n                max-touch := TouchArea { mouse-cursor: pointer; clicked => { root.maximize-window(); } }\n            }\n            Rectangle {\n                x: 217px; y: 1px; width: 42px; height: 32px;\n                border-radius: 10px;\n                background: close-touch.pressed\n                    ? rgb(62, 23, 36)\n                    : close-touch.has-hover ? rgb(48, 18, 28) : transparent;\n                Path {\n                    x: 12px; y: 8px; width: 18px; height: 18px;\n                    commands: "M 9 1 L 9 8 M 3.3 3.7 A 7 7 0 1 0 14.7 3.7";\n                    stroke: close-touch.has-hover ? #ff5d78 : #ff9fbd;\n                    stroke-width: 2px; stroke-line-cap: round;\n                }\n                close-touch := TouchArea { mouse-cursor: pointer; clicked => { root.close-window(); } }\n            }'''
          s = repl(s, close_block, controls, 'min max controls')

          # Never insert hard newlines merely because text reaches a display/page width.
          s = repl(s, '''    fn page_wrap_columns(&self) -> Option<usize> {\n        let current = self.current_file.as_deref()?;\n        document::is_supported_text_path(current).then(|| self.page_profile.text_columns())\n    }''', '''    fn page_wrap_columns(&self) -> Option<usize> {\n        // Paragraph structure belongs to the document. Display width must never\n        // rewrite prose into hard-wrapped physical lines.\n        None\n    }''', 'disable hard wrap')

          # Native window control functions.
          marker = '''#[cfg(windows)]\nunsafe fn focus_native_window(hwnd: HWND) {'''
          funcs = '''#[cfg(windows)]\nunsafe fn minimize_native_window(hwnd: HWND) {\n    unsafe {\n        ShowWindow(hwnd, SW_MINIMIZE);\n    }\n}\n\n#[cfg(windows)]\nunsafe fn toggle_maximize_native_window(hwnd: HWND) {\n    unsafe {\n        if IsZoomed(hwnd) != 0 {\n            ShowWindow(hwnd, SW_RESTORE);\n            enable_native_rounded_corners(hwnd);\n        } else {\n            ShowWindow(hwnd, SW_MAXIMIZE);\n        }\n    }\n}\n\n#[cfg(windows)]\nunsafe fn focus_native_window(hwnd: HWND) {'''
          s = repl(s, marker, funcs, 'native min max functions')

          handler_marker = '''    {\n        let weak = ui.as_weak();\n        ui.on_close_window(move || {'''
          handlers = '''    {\n        let weak = ui.as_weak();\n        ui.on_minimize_window(move || {\n            if let Some(ui) = weak.upgrade() {\n                #[cfg(windows)]\n                if let Some(hwnd) = slint_hwnd(&ui) {\n                    unsafe { minimize_native_window(hwnd); }\n                }\n            }\n        });\n    }\n    {\n        let weak = ui.as_weak();\n        ui.on_maximize_window(move || {\n            if let Some(ui) = weak.upgrade() {\n                #[cfg(windows)]\n                if let Some(hwnd) = slint_hwnd(&ui) {\n                    unsafe { toggle_maximize_native_window(hwnd); }\n                }\n            }\n        });\n    }\n    {\n        let weak = ui.as_weak();\n        ui.on_close_window(move || {'''
          s = repl(s, handler_marker, handlers, 'window callback handlers')
          p.write_text(s, encoding='utf-8')

          # CLI identification / upstream attribution.
          p = Path('src/main.rs')
          s = p.read_text(encoding='utf-8')
          marker = '''    let args = std::env::args().skip(1).collect::<Vec<_>>();\n\n    if args.first().map(String::as_str) == Some("--helix-sst-spell") {'''
          replacement = '''    let args = std::env::args().skip(1).collect::<Vec<_>>();\n\n    if args.iter().any(|arg| arg == "--version" || arg == "-V") {\n        println!("helix-sst {} (Helix {})", env!("CARGO_PKG_VERSION"), editor::HELIX_UPSTREAM_VERSION);\n        return Ok(());\n    }\n    if args.iter().any(|arg| arg == "--credits" || arg == "--about") {\n        println!("Helix-SST Zen — standalone writing shell built on Helix {}.", editor::HELIX_UPSTREAM_VERSION);\n        println!("Helix editor: https://helix-editor.com/ — MPL-2.0");\n        return Ok(());\n    }\n\n    if args.first().map(String::as_str) == Some("--helix-sst-spell") {'''
          s = repl(s, marker, replacement, 'version credits CLI')
          p.write_text(s, encoding='utf-8')

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/main.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: add window controls, preserve paragraphs and restore CLI credits"
          git push
