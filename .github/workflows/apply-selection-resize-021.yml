name: Apply selection and resize fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch editor behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          app = Path('src/app.rs')
          s = app.read_text(encoding='utf-8')

          s = replace_once(s,
          '''    f2_menu_open: bool,\n    f2_close_at: Option<Instant>,\n''',
          '''    f2_menu_open: bool,\n    f2_close_at: Option<Instant>,\n    layout_redraw_at: Option<Instant>,\n''',
          'model redraw field')

          s = replace_once(s,
          '''            f2_menu_open: false,\n            f2_close_at: None,\n''',
          '''            f2_menu_open: false,\n            f2_close_at: None,\n            layout_redraw_at: None,\n''',
          'model redraw init')

          s = replace_once(s,
          '''            self.zen_requested = !self.zen_requested;\n            self.dirty = true;\n            self.glyphs.clear();\n''',
          '''            self.zen_requested = !self.zen_requested;\n            self.layout_redraw_at = Some(Instant::now() + Duration::from_millis(220));\n            self.dirty = true;\n            self.glyphs.clear();\n''',
          'zen redraw scheduling')

          s = replace_once(s,
          '''                if let Err(error) = editor.resize(cols, rows) {\n                    self.launcher.message =\n                        Some(format!("No se pudo redimensionar Helix: {error}"));\n                }\n''',
          '''                if let Err(error) = editor.resize(cols, rows) {\n                    self.launcher.message =\n                        Some(format!("No se pudo redimensionar Helix: {error}"));\n                } else {\n                    self.layout_redraw_at =\n                        Some(Instant::now() + Duration::from_millis(120));\n                }\n''',
          'resize redraw scheduling')

          tick_anchor = '''        let current_source = self.current_file.clone();\n        if let Some(editor) = self.editor.as_mut() {\n'''
          tick_replacement = '''        if self\n            .layout_redraw_at\n            .is_some_and(|deadline| Instant::now() >= deadline)\n        {\n            self.layout_redraw_at = None;\n            self.reset_parser();\n            if let Some(editor) = self.editor.as_mut()\n                && let Err(error) = editor.force_terminal_redraw()\n            {\n                self.launcher.message =\n                    Some(format!("No se pudo reajustar Helix al tamaño de la ventana: {error}"));\n            }\n            self.glyphs.clear();\n            self.dirty = true;\n        }\n\n        let current_source = self.current_file.clone();\n        if let Some(editor) = self.editor.as_mut() {\n'''
          s = replace_once(s, tick_anchor, tick_replacement, 'deferred redraw tick')

          select_helper_anchor = '''    fn helix_is_normal_mode(&self) -> bool {\n'''
          select_helper = '''    fn helix_is_select_mode(&self) -> bool {\n        let screen = self.parser.screen();\n        let (rows, cols) = screen.size();\n        let start_row = rows.saturating_sub(3);\n        for row in start_row..rows {\n            let mut text = String::new();\n            for col in 0..cols.min(32) {\n                let Some(cell) = screen.cell(row, col) else {\n                    continue;\n                };\n                if cell.is_wide_continuation() {\n                    continue;\n                }\n                text.push_str(cell.contents());\n            }\n            if text.trim_start().starts_with("SELECCIÓN") {\n                return true;\n            }\n        }\n        false\n    }\n\n    fn helix_is_normal_mode(&self) -> bool {\n'''
          s = replace_once(s, select_helper_anchor, select_helper, 'select mode detector')

          paste_anchor = '''        let ctrl_v = key.modifiers.contains(KeyModifiers::CONTROL)\n            && matches!(key.code, KeyCode::Char('v') | KeyCode::Char('V'));\n'''
          select_replace = '''        if self.helix_is_select_mode()\n            && !key.modifiers.contains(KeyModifiers::CONTROL)\n            && !key.modifiers.contains(KeyModifiers::ALT)\n        {\n            if let Some(editor) = self.editor.as_ref() {\n                let win32 = editor.win32_input();\n                match key.code {\n                    KeyCode::Char(_) | KeyCode::Enter | KeyCode::Tab => {\n                        let _ = editor.send_key(\n                            KeyEvent::new(KeyCode::F(22), KeyModifiers::NONE),\n                            win32,\n                        );\n                        let _ = editor.send_key(key, win32);\n                        return;\n                    }\n                    KeyCode::Backspace | KeyCode::Delete => {\n                        let _ = editor.send_key(\n                            KeyEvent::new(KeyCode::F(22), KeyModifiers::NONE),\n                            win32,\n                        );\n                        return;\n                    }\n                    _ => {}\n                }\n            }\n        }\n\n        let ctrl_v = key.modifiers.contains(KeyModifiers::CONTROL)\n            && matches!(key.code, KeyCode::Char('v') | KeyCode::Char('V'));\n'''
          s = replace_once(s, paste_anchor, select_replace, 'replace selected text')

          paste_body = '''        if ctrl_v {\n            let ensure_insert = !self.helix_is_insert_mode();\n            if let Ok(mut clipboard) = arboard::Clipboard::new()\n                && let Ok(text) = clipboard.get_text()\n                && let Some(editor) = self.editor.as_ref()\n            {\n                let _ = editor.paste(&text, ensure_insert, self.page_wrap_columns());\n            }\n            return;\n        }\n'''
          paste_new = '''        if ctrl_v {\n            let replacing_selection = self.helix_is_select_mode();\n            let ensure_insert = !self.helix_is_insert_mode();\n            if let Ok(mut clipboard) = arboard::Clipboard::new()\n                && let Ok(text) = clipboard.get_text()\n                && let Some(editor) = self.editor.as_ref()\n            {\n                if replacing_selection {\n                    let _ = editor.send_key(\n                        KeyEvent::new(KeyCode::F(22), KeyModifiers::NONE),\n                        editor.win32_input(),\n                    );\n                }\n                let _ = editor.paste(&text, ensure_insert, self.page_wrap_columns());\n            }\n            return;\n        }\n'''
          s = replace_once(s, paste_body, paste_new, 'paste over selection')

          app.write_text(s, encoding='utf-8')

          editor = Path('src/editor.rs')
          e = editor.read_text(encoding='utf-8')
          e = replace_once(e,
          '''F19 = "select_all"\n"#\n''',
          '''F19 = "select_all"\nF22 = ["delete_selection", "insert_mode"]\n"#\n''',
          'select mode replace bridge')
          editor.write_text(e, encoding='utf-8')

          cargo = Path('Cargo.toml')
          c = cargo.read_text(encoding='utf-8')
          c = c.replace('version = "0.2.20"', 'version = "0.2.21"', 1)
          cargo.write_text(c, encoding='utf-8')

          lock = Path('Cargo.lock')
          l = lock.read_text(encoding='utf-8')
          marker = 'name = "zen-editor"\nversion = "0.2.20"'
          if marker not in l:
              raise SystemExit('missing Cargo.lock version marker')
          lock.write_text(l.replace(marker, 'name = "zen-editor"\nversion = "0.2.21"', 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          ch = changelog.read_text(encoding='utf-8')
          heading = '# Historial de versiones — Zen Editor\n\nCambios funcionales por versión. Se omiten commits internos de mantenimiento, pruebas temporales y workflows de parcheo.\n\n'
          entry = '''## v0.2.21 — 2026-10-17\n- La escritura reemplaza correctamente una selección activa, como en un editor convencional.\n- Retroceso y Suprimir eliminan completamente el texto seleccionado.\n- Pegar reemplaza la selección activa.\n- El contenido se recalcula y repinta después de maximizar, restaurar o redimensionar la ventana.\n\n'''
          if heading not in ch:
              raise SystemExit('missing changelog heading')
          changelog.write_text(ch.replace(heading, heading + entry, 1), encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-selection-resize-021.yml
          git add src/app.rs src/editor.rs Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "fix: replace selections and reflow after window resize [skip ci]"
          git push origin HEAD:main
