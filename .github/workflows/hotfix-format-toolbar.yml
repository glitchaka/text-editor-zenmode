name: Apply formatting toolbar and strike support

on:
  push:
    paths:
      - '.github/workflows/hotfix-format-toolbar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch formatting UI and model
        shell: python
        run: |
          from pathlib import Path

          def repl(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          # ---------- format.rs ----------
          p = Path('src/format.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '    Underline,\n    LegacyHighlight,', '    Underline,\n    Strikethrough,\n    LegacyHighlight,', 'MarkKind strike')
          s = repl(s, '            MarkKind::Underline => 5,\n            MarkKind::Foreground(color)', '            MarkKind::Underline => 5,\n            MarkKind::Strikethrough => 2,\n            MarkKind::Foreground(color)', 'semantic strike')
          s = repl(s, '    pub underline: bool,\n    pub foreground:', '    pub underline: bool,\n    pub strikethrough: bool,\n    pub foreground:', 'TextStyle strike')
          s = repl(s, '        "underline" => toggle_delimited(input, "__", "__"),\n        "highlight"', '        "underline" => toggle_delimited(input, "__", "__"),\n        "strikethrough" => toggle_delimited(input, "~~", "~~"),\n        "highlight"', 'test action strike')
          s = repl(s, '''        if tail.starts_with("==") {\n            flush(&mut runs, &mut current, style);\n            style.background = if style.background == Some(PaletteColor::Yellow) {''', '''        if tail.starts_with("~~") {\n            flush(&mut runs, &mut current, style);\n            style.strikethrough = !style.strikethrough;\n            index += 2;\n            continue;\n        }\n        if tail.starts_with("==") {\n            flush(&mut runs, &mut current, style);\n            style.background = if style.background == Some(PaletteColor::Yellow) {''', 'parse strike markup')
          s = repl(s, '    push_delimited_ranges(line, "__", MarkKind::Underline, &mut ranges);\n    push_delimited_ranges(line, "==",', '    push_delimited_ranges(line, "__", MarkKind::Underline, &mut ranges);\n    push_delimited_ranges(line, "~~", MarkKind::Strikethrough, &mut ranges);\n    push_delimited_ranges(line, "==",', 'style range strike')
          p.write_text(s, encoding='utf-8')

          # ---------- document.rs ----------
          p = Path('src/document.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '''        if run.style.underline {\n            object.insert("underline".into(), json!(true));\n        }\n        if let Some(color) = run.style.foreground {''', '''        if run.style.underline {\n            object.insert("underline".into(), json!(true));\n        }\n        if run.style.strikethrough {\n            object.insert("strikethrough".into(), json!(true));\n        }\n        if let Some(color) = run.style.foreground {''', 'formatting payload strike')
          s = repl(s, '''                underline: value\n                    .get("underline")\n                    .and_then(Value::as_bool)\n                    .unwrap_or(false),\n                foreground:''', '''                underline: value\n                    .get("underline")\n                    .and_then(Value::as_bool)\n                    .unwrap_or(false),\n                strikethrough: value\n                    .get("strikethrough")\n                    .and_then(Value::as_bool)\n                    .unwrap_or(false),\n                foreground:''', 'decode strike')
          s = repl(s, '''        if style.underline {\n            object.insert("underline".into(), json!(true));\n        }\n        if let Some(color) = style.foreground {''', '''        if style.underline {\n            object.insert("underline".into(), json!(true));\n        }\n        if style.strikethrough {\n            object.insert("strikethrough".into(), json!(true));\n        }\n        if let Some(color) = style.foreground {''', 'encode strike')
          s = repl(s, '''    if style.underline {\n        output = format!("__{output}__");\n    }\n    if style.italic {''', '''    if style.underline {\n        output = format!("__{output}__");\n    }\n    if style.strikethrough {\n        output = format!("~~{output}~~");\n    }\n    if style.italic {''', 'rich strike')
          s = repl(s, '        "underline" => style.underline = !style.underline,\n        "highlight"', '        "underline" => style.underline = !style.underline,\n        "strikethrough" => style.strikethrough = !style.strikethrough,\n        "highlight"', 'style action strike')
          p.write_text(s, encoding='utf-8')

          # ---------- spell.rs ----------
          p = Path('src/spell.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '            push_format("Formato · Subrayado", "underline", "");\n            for (label, value)', '            push_format("Formato · Subrayado", "underline", "");\n            push_format("Formato · Tachado", "strikethrough", "");\n            for (label, value)', 'F2 strike')
          p.write_text(s, encoding='utf-8')

          # ---------- export.rs ----------
          p = Path('src/export.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '''            || style.underline\n            || style.foreground.is_some()''', '''            || style.underline\n            || style.strikethrough\n            || style.foreground.is_some()''', 'docx style condition')
          s = repl(s, '''            if style.underline {\n                xml.push_str(r#"<w:u w:val=\"single\"/>"#);\n            }\n            if let Some(color) = style.foreground {''', '''            if style.underline {\n                xml.push_str(r#"<w:u w:val=\"single\"/>"#);\n            }\n            if style.strikethrough {\n                xml.push_str("<w:strike/>");\n            }\n            if let Some(color) = style.foreground {''', 'docx strike')
          p.write_text(s, encoding='utf-8')

          # ---------- app.rs ----------
          p = Path('src/app.rs')
          s = p.read_text(encoding='utf-8')
          s = repl(s, '''        bottom-reveal := TouchArea {\n            x: root.width - 224px;\n            y: root.height - 10px;\n            width: 224px;''', '''        bottom-reveal := TouchArea {\n            x: root.width - 468px;\n            y: root.height - 10px;\n            width: 468px;''', 'expanded zen reveal')
          s = repl(s, '''            visible: !root.zen-active\n                || bottom-reveal.has-hover\n                || island-hover.has-hover\n                || root.symbols-open;''', '''            visible: !root.zen-active\n                || bottom-reveal.has-hover\n                || island-hover.has-hover\n                || root.symbols-open\n                || root.font-palette-open\n                || root.highlight-palette-open\n                || root.page-menu-open;''', 'island palette visibility')

          island_end = '''        }\n        font-palette := Rectangle {'''
          toolbar = '''        }\n\n        format-island := Rectangle {\n            visible: root.editor-active && (\n                !root.zen-active\n                || bottom-reveal.has-hover\n                || format-hover.has-hover\n                || root.font-palette-open\n                || root.highlight-palette-open\n                || root.page-menu-open\n            );\n            width: 236px;\n            height: 34px;\n            x: island.x - self.width - 6px;\n            y: island.y;\n            border-radius: 13px;\n            background: rgba(10, 13, 20, 0.96);\n            border-width: 1px;\n            border-color: #2b3547;\n\n            format-hover := TouchArea { x: 0; y: 0; width: parent.width; height: parent.height; }\n            format-move := WindowMoveArea { x: 0; y: 0; width: parent.width; height: parent.height; enabled: !root.zen-active; }\n\n            Rectangle { x: 4px; y: 3px; width: 30px; height: 28px; border-radius: 8px; background: bold-touch.pressed ? #29384b : bold-touch.has-hover ? #172334 : transparent; Text { width: 100%; height: 100%; text: "B"; color: #dfe8ef; font-weight: 800; horizontal-alignment: center; vertical-alignment: center; } bold-touch := TouchArea { mouse-cursor: pointer; clicked => { root.format-action("bold", ""); terminal-focus.focus(); } } }\n            Rectangle { x: 37px; y: 3px; width: 30px; height: 28px; border-radius: 8px; background: italic-touch.pressed ? #29384b : italic-touch.has-hover ? #172334 : transparent; Text { width: 100%; height: 100%; text: "I"; color: #dfe8ef; horizontal-alignment: center; vertical-alignment: center; } italic-touch := TouchArea { mouse-cursor: pointer; clicked => { root.format-action("italic", ""); terminal-focus.focus(); } } }\n            Rectangle { x: 70px; y: 3px; width: 30px; height: 28px; border-radius: 8px; background: underline-touch.pressed ? #29384b : underline-touch.has-hover ? #172334 : transparent; Text { width: 100%; height: 100%; text: "U"; color: #dfe8ef; horizontal-alignment: center; vertical-alignment: center; } underline-touch := TouchArea { mouse-cursor: pointer; clicked => { root.format-action("underline", ""); terminal-focus.focus(); } } }\n            Rectangle { x: 103px; y: 3px; width: 30px; height: 28px; border-radius: 8px; background: strike-touch.pressed ? #29384b : strike-touch.has-hover ? #172334 : transparent; Text { width: 100%; height: 100%; text: "S̶"; color: #dfe8ef; horizontal-alignment: center; vertical-alignment: center; } strike-touch := TouchArea { mouse-cursor: pointer; clicked => { root.format-action("strikethrough", ""); terminal-focus.focus(); } } }\n            Rectangle { x: 136px; y: 3px; width: 30px; height: 28px; border-radius: 8px; background: font-touch.pressed ? #29384b : font-touch.has-hover ? #172334 : transparent; Text { width: 100%; height: 100%; text: "A"; color: #e8cc83; font-weight: 700; horizontal-alignment: center; vertical-alignment: center; } font-touch := TouchArea { mouse-cursor: pointer; clicked => { root.font-palette-open = !root.font-palette-open; root.highlight-palette-open = false; root.page-menu-open = false; root.symbols-open = false; } } }\n            Rectangle { x: 169px; y: 3px; width: 30px; height: 28px; border-radius: 8px; background: highlight-touch.pressed ? #29384b : highlight-touch.has-hover ? #172334 : transparent; Text { width: 100%; height: 100%; text: "▰"; color: #fabd2f; horizontal-alignment: center; vertical-alignment: center; } highlight-touch := TouchArea { mouse-cursor: pointer; clicked => { root.highlight-palette-open = !root.highlight-palette-open; root.font-palette-open = false; root.page-menu-open = false; root.symbols-open = false; } } }\n            Rectangle { x: 202px; y: 3px; width: 30px; height: 28px; border-radius: 8px; background: page-touch.pressed ? #29384b : page-touch.has-hover ? #172334 : transparent; Text { width: 100%; height: 100%; text: "▣"; color: #8db9bb; horizontal-alignment: center; vertical-alignment: center; } page-touch := TouchArea { mouse-cursor: pointer; clicked => { root.page-menu-open = !root.page-menu-open; root.font-palette-open = false; root.highlight-palette-open = false; root.symbols-open = false; } } }\n        }\n\n        font-palette := Rectangle {'''
          s = repl(s, island_end, toolbar, 'insert formatting island')
          s = repl(s, '''            x: island.x + 270px;\n            y: island.y + island.height + 5px;''', '''            x: format-island.x + 4px;\n            y: format-island.y - self.height - 5px;''', 'font palette position')
          s = repl(s, '''            x: island.x + 308px;\n            y: island.y + island.height + 5px;''', '''            x: format-island.x + 4px;\n            y: format-island.y - self.height - 5px;''', 'highlight palette position')
          s = repl(s, '''            x: island.x + island.width - 430px;\n            y: island.y + island.height + 5px;''', '''            x: format-island.x + format-island.width - self.width;\n            y: format-island.y - self.height - 5px;''', 'page palette position')
          s = repl(s, '''                    style.underline |= run_style.underline;\n                    if run_style.foreground.is_some() {''', '''                    style.underline |= run_style.underline;\n                    style.strikethrough |= run_style.strikethrough;\n                    if run_style.foreground.is_some() {''', 'overlay strike merge')
          s = repl(s, '''                if cell.underline() || overlay_style.underline {\n                    let thickness = scale.round().max(1.0) as i32;\n                    let underline_y = (baseline + thickness).min(y + h - thickness);\n                    fill_rect(pixels, (width, height), (x, underline_y, w, thickness), fg);\n                }\n''', '''                if cell.underline() || overlay_style.underline {\n                    let thickness = scale.round().max(1.0) as i32;\n                    let underline_y = (baseline + thickness).min(y + h - thickness);\n                    fill_rect(pixels, (width, height), (x, underline_y, w, thickness), fg);\n                }\n                if overlay_style.strikethrough {\n                    let thickness = scale.round().max(1.0) as i32;\n                    let strike_y = y + (cell_height * 0.48).round() as i32;\n                    fill_rect(pixels, (width, height), (x, strike_y, w, thickness), fg);\n                }\n''', 'render strike')
          p.write_text(s, encoding='utf-8')

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/document.rs src/export.rs src/format.rs src/spell.rs
          git diff --cached --quiet && exit 0
          git commit -m "feat: restore visible formatting toolbar and strikethrough"
          git push
